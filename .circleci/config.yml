version: 2.1

jobs:
  desktop-local-live-smoke:
    docker:
      - image: mcr.microsoft.com/playwright:v1.55.0-noble
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install PHP lint
          command: |
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli
      - run:
          name: Check desktop local live
          command: bash qa/desktop-local-live-smoke.sh

workflows:
  desktop-local-live:
    jobs:
      - desktop-local-live-smoke:
          filters:
            branches:
              only: ai-repair/local-desktop-live-smoke-20260825
