version: 2.1

jobs:
  apply-natural-voice:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Apply natural voice patch to feature branch
          command: |
            set -euo pipefail
            : "${GITHUB_REPORT_TOKEN:?GITHUB_REPORT_TOKEN fehlt}"
            git config user.name 'kp-android-fix-bot'
            git config user.email 'android-fix@users.noreply.github.com'
            git remote set-url origin "https://x-access-token:${GITHUB_REPORT_TOKEN}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
            git fetch origin feature/webapp-primary-agent --quiet
            git checkout -B work origin/feature/webapp-primary-agent
            python3 qa/apply-natural-voice-source-patch.py
            git diff --check
            git add android/homepage-technician/app/src/main/java/de/koblenzerpuppenspiele/techniker/LocalVoiceController.kt \
                    android/homepage-technician/app/src/main/java/de/koblenzerpuppenspiele/techniker/LiveLocalActivity.kt \
                    .circleci/config.yml
            git commit -m 'feat(android): use natural Thorsten voice with echo-safe half duplex'
            git push origin HEAD:feature/webapp-primary-agent

workflows:
  apply-natural-voice:
    jobs:
      - apply-natural-voice:
          filters:
            branches:
              only: staging/android-natural-voice-patch-20260825
