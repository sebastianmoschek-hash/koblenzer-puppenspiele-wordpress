version: 2.1

jobs:
  apply-hotfix:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Apply model bridge recursion fix
          command: |
            set -e
            test -n "$GITHUB_REPORT_TOKEN"
            git config user.name kp-android-fix-bot
            git config user.email android-fix@users.noreply.github.com
            git remote set-url origin "https://x-access-token:${GITHUB_REPORT_TOKEN}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
            git fetch origin feature/webapp-primary-agent --quiet
            git checkout -B work origin/feature/webapp-primary-agent
            python3 -c "from pathlib import Path; p=Path('android/homepage-technician/app/src/main/java/de/koblenzerpuppenspiele/techniker/LiveLocalActivity.kt'); s=p.read_text(); old='runOnUiThread { installModel() }'; assert s.count(old)==1; p.write_text(s.replace(old,'runOnUiThread { this@LiveLocalActivity.installModel() }',1))"
            python3 -c "from pathlib import Path; p=Path('android/homepage-technician/app/build.gradle.kts'); s=p.read_text(); assert 'versionCode = 4' in s; s=s.replace('versionCode = 4','versionCode = 5',1).replace('versionName = \"0.4.0-owner-login\"','versionName = \"0.5.0-local-download-fix\"',1); p.write_text(s)"
            git add android/homepage-technician/app/src/main/java/de/koblenzerpuppenspiele/techniker/LiveLocalActivity.kt android/homepage-technician/app/build.gradle.kts
            git commit -m "fix(android): stop recursive local model installer bridge"
            git push origin HEAD:feature/webapp-primary-agent

workflows:
  hotfix-workflow:
    jobs:
      - apply-hotfix
