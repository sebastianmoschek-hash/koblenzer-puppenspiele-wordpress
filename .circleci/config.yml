version: 2.1

jobs:
  deploy-fast-web-edit-staging:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Deploy only fast visible edit planner to staging
          command: |
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq lftp php-cli
            php -l wp-content/mu-plugins/kp-owner-web-edit-fast.php
            export LFTP_PASSWORD="${STAGING_FTP_PASSWORD:-${LFTP_PASSWORD:-}}"
            : "${STAGING_FTP_SERVER:?STAGING_FTP_SERVER fehlt}"
            : "${STAGING_FTP_USERNAME:?STAGING_FTP_USERNAME fehlt}"
            : "${LFTP_PASSWORD:?STAGING_FTP_PASSWORD fehlt}"
            lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; set net:max-retries 2; set net:timeout 20; open --user '$STAGING_FTP_USERNAME' --env-password -p 21 '$STAGING_FTP_SERVER'; put 'wp-content/mu-plugins/kp-owner-web-edit-fast.php' -o '/wp-content/mu-plugins/kp-owner-web-edit-fast.php'; bye"
            echo 'PASS fast visible edit planner deployed to staging; production untouched.'

workflows:
  staging-fast-web-edit:
    jobs:
      - deploy-fast-web-edit-staging:
          filters:
            branches:
              only: staging/webapp-fast-edit-20260825
