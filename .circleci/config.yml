version: 2.1

jobs:
  apply-thorsten-high:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Apply Thorsten High without system fallback
          command: |
            set -euo pipefail
            : "${GITHUB_REPORT_TOKEN:?GITHUB_REPORT_TOKEN fehlt}"
            git config user.name 'kp-android-fix-bot'
            git config user.email 'android-fix@users.noreply.github.com'
            git remote set-url origin "https://x-access-token:${GITHUB_REPORT_TOKEN}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
            git fetch origin feature/webapp-primary-agent --quiet
            git checkout -B work origin/feature/webapp-primary-agent
            python3 qa/apply-thorsten-high-fix.py
            git diff --check
            git add android/homepage-technician/app/src/main/java/de/koblenzerpuppenspiele/techniker/LocalNaturalVoice.kt
            git add android/homepage-technician/app/src/main/java/de/koblenzerpuppenspiele/techniker/LocalVoiceController.kt
            git add android/homepage-technician/app/src/main/java/de/koblenzerpuppenspiele/techniker/LiveLocalActivity.kt
            git add android/homepage-technician/app/build.gradle.kts
            git add qa/prepare-android-natural-voice.sh
            git commit -m 'fix(android): use Thorsten High without system voice fallback'
            git push origin HEAD:feature/webapp-primary-agent

workflows:
  thorsten-high-patch:
    jobs:
      - apply-thorsten-high:
          filters:
            branches:
              only: staging/android-thorsten-high-patch-20260825
