version: 2.1

executors:
  editor-contract:
    docker:
      - image: mcr.microsoft.com/playwright:v1.55.0-noble
    resource_class: small

jobs:
  word-history-contract:
    executor: editor-contract
    steps:
      - checkout
      - run:
          name: Install PHP lint
          command: |
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli
      - run:
          name: Word and Canva history contract
          command: bash qa/word-history-contract.sh

  unified-editor-contract:
    executor: editor-contract
    steps:
      - checkout
      - run:
          name: Install PHP lint
          command: |
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli
      - run:
          name: Unified Save Undo and AI contract
          command: |
            bash qa/unified-editor-contract.sh
            bash qa/text-save-contract.sh

  create-undo-contract:
    executor: editor-contract
    steps:
      - checkout
      - run:
          name: Install PHP lint
          command: |
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli
      - run:
          name: Reversible create Undo Redo contract
          command: bash qa/create-undo-contract.sh

  calendar-undo-contract:
    executor: editor-contract
    steps:
      - checkout
      - run:
          name: Install PHP lint
          command: |
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli
      - run:
          name: Reversible calendar Undo Redo contract
          command: bash qa/calendar-undo-contract.sh

  text-save-staging-lab:
    docker:
      - image: mcr.microsoft.com/playwright:v1.55.0-noble
    resource_class: small
    environment:
      STAGING_BASE: https://neu.koblenzer-puppenspiele.de
    steps:
      - checkout
      - run:
          name: Install staging text-save tools
          command: |
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq lftp php-cli ca-certificates
            npm install --no-save --no-audit --no-fund --prefer-offline playwright@1.55.0
      - run:
          name: Real text edit save reload and restore
          command: bash qa/text-save-staging-lab.sh
          no_output_timeout: 12m

  homepage-staging-lab:
    docker:
      - image: mcr.microsoft.com/playwright:v1.55.0-noble
    resource_class: small
    environment:
      STAGING_BASE: https://neu.koblenzer-puppenspiele.de
    steps:
      - checkout
      - run:
          name: Classify change and stop superseded work
          command: bash qa/circleci-classify.sh
      - run:
          name: Install lightweight CI tools
          command: |
            mkdir -p qa-results/circleci
            {
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq lftp jq php-cli ca-certificates curl git
              if [[ "${KP_CI_MODE:-full}" != "pwa" ]]; then
                npm install --no-save --no-audit --no-fund --prefer-offline playwright@1.55.0
              else
                echo 'PWA-fast mode: skipping Playwright npm install.'
              fi
            } 2>&1 | tee qa-results/circleci/install.log
      - run:
          name: Protect shared staging design colors
          command: node qa/neutralize-staging-color-mutations.mjs
      - run:
          name: Align browser lab with guarded mobile interactions
          command: |
            python3 - <<'PY'
            from pathlib import Path

            session = Path('qa/editor-session-undo-e2e.mjs')
            text = session.read_text()
            old = "await page.mouse.move(box.x+box.width/2,box.y+box.height/2);await page.mouse.down();await page.mouse.move(box.x+box.width/2+18,box.y+box.height/2+10,{steps:4});await page.mouse.up();await page.waitForTimeout(180);"
            new = "await page.mouse.move(box.x+box.width/2,box.y+box.height/2);await page.mouse.down();await page.waitForTimeout(380);await page.mouse.move(box.x+box.width/2+18,box.y+box.height/2+10,{steps:4});await page.mouse.up();await page.waitForTimeout(180);"
            if old not in text:
                raise SystemExit('session-undo menu drag pattern not found')
            session.write_text(text.replace(old, new, 1))

            persistence = Path('qa/owner-all-persistence-e2e.mjs')
            text = persistence.read_text()
            old = """async function openDesign() {
  await page.locator('.kp-oa-tools').click();
  await page.locator('[data-action=\"design\"]').click();
  await page.locator('.kp-oa-sheet.is-design [data-design=\"header_radius\"]').waitFor({ state:'attached', timeout:10000 });
  await page.waitForTimeout(350);
}"""
            new = """async function openDesign() {
  const tools = page.locator('.kp-oa-tools').first();
  await tools.waitFor({ state:'visible', timeout:10000 });
  await tools.click({ force:true });
  const designAction = page.locator('[data-action=\"design\"]').first();
  await designAction.waitFor({ state:'visible', timeout:10000 });
  await designAction.click({ force:true });
  await page.locator('.kp-oa-sheet.is-design [data-design=\"header_radius\"]').waitFor({ state:'attached', timeout:10000 });
  await page.waitForTimeout(350);
}"""
            if old not in text:
                raise SystemExit('persistence openDesign pattern not found')
            persistence.write_text(text.replace(old, new, 1))
            PY
      - run:
          name: Smart staging deploy + homepage lab
          command: bash qa/circleci-homepage-lab-smart.sh
          no_output_timeout: 20m
      - run:
          name: Publish latest safe lab report back to GitHub
          when: always
          command: bash qa/publish-circleci-report-to-github.sh
      - store_artifacts:
          path: qa-results/circleci
          destination: circleci-lab-report
      - store_artifacts:
          path: qa-artifacts/homepage-lab
          destination: editor-browser-screenshots
      - store_artifacts:
          path: visual-qa/output
          destination: visual-qa

workflows:
  autonomous-homepage-lab:
    jobs:
      - word-history-contract:
          filters:
            branches:
              only: main
      - unified-editor-contract:
          filters:
            branches:
              only: main
      - create-undo-contract:
          filters:
            branches:
              only: main
      - calendar-undo-contract:
          filters:
            branches:
              only: main
      - text-save-staging-lab:
          requires:
            - word-history-contract
            - unified-editor-contract
            - create-undo-contract
            - calendar-undo-contract
          # The text test mutates staging briefly and restores its snapshot.
          # Keep it in the same serialized lane as the full browser laboratory.
          serial-group: << pipeline.project.slug >>/homepage-staging-lab
          filters:
            branches:
              only: main
      - homepage-staging-lab:
          requires:
            - word-history-contract
            - unified-editor-contract
            - create-undo-contract
            - calendar-undo-contract
            - text-save-staging-lab
          # Staging is one shared mutable environment. Only real staging jobs are
          # serialized; deterministic contracts are safe to run in parallel.
          serial-group: << pipeline.project.slug >>/homepage-staging-lab
          filters:
            branches:
              only: main
