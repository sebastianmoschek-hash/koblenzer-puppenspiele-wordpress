version: 2.1

jobs:
  desktop-ai-fast-deploy:
    docker:
      - image: cimg/php:8.3
    resource_class: small
    environment:
      STAGING_BASE: https://neu.koblenzer-puppenspiele.de
    steps:
      - checkout
      - run:
          name: Validate and deploy desktop AI only
          command: bash qa/deploy-desktop-ai-fast-circleci.sh

workflows:
  desktop-ai-fast:
    jobs:
      - desktop-ai-fast-deploy:
          filters:
            branches:
              only: desktop-ai-fast
