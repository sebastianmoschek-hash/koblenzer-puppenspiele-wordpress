version: 2.1

jobs:
  deploy-primary-web-agent-staging:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Deploy only owner web-agent files to staging
          command: |
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq lftp php-cli curl
            php -l wp-content/mu-plugins/kp-owner-web-agent.php
            export LFTP_PASSWORD="${STAGING_FTP_PASSWORD:-${LFTP_PASSWORD:-}}"
            : "${STAGING_FTP_SERVER:?STAGING_FTP_SERVER fehlt}"
            : "${STAGING_FTP_USERNAME:?STAGING_FTP_USERNAME fehlt}"
            : "${LFTP_PASSWORD:?STAGING_FTP_PASSWORD fehlt}"
            lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; set net:max-retries 2; set net:timeout 20; open --user '$STAGING_FTP_USERNAME' --env-password -p 21 '$STAGING_FTP_SERVER'; put 'wp-content/mu-plugins/kp-owner-web-agent.php' -o '/wp-content/mu-plugins/kp-owner-web-agent.php'; put 'wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/owner-web-agent.js' -o '/wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/owner-web-agent.js'; put 'wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/owner-web-agent.css' -o '/wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/owner-web-agent.css'; bye"
            curl -fsSL 'https://neu.koblenzer-puppenspiele.de/wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/owner-web-agent.js?kp_agent=20260825' | grep -q 'KPOwnerWebAgent'
            curl -fsSL 'https://neu.koblenzer-puppenspiele.de/wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/owner-web-agent.css?kp_agent=20260825' | grep -q 'kp-wa-bar'
            echo 'PASS staging primary web-agent assets deployed; production untouched.'

workflows:
  staging-primary-web-agent:
    jobs:
      - deploy-primary-web-agent-staging:
          filters:
            branches:
              only: staging/webapp-primary-agent-20260825
