version: 2.1

jobs:
  deploy-emergency-gemini-staging:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - checkout
      - run:
          name: Deploy protected emergency Gemini endpoint to staging only
          command: |
            set -euo pipefail
            FILE='wp-content/mu-plugins/kp-mobile-emergency-gemini.php'
            test -f "$FILE"
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli lftp curl
            php -l "$FILE"
            : "${STAGING_FTP_SERVER:?STAGING_FTP_SERVER fehlt}"
            : "${STAGING_FTP_USERNAME:?STAGING_FTP_USERNAME fehlt}"
            : "${STAGING_FTP_PASSWORD:?STAGING_FTP_PASSWORD fehlt}"
            export LFTP_PASSWORD="$STAGING_FTP_PASSWORD"
            lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; set net:max-retries 2; set net:timeout 20; open --user '$STAGING_FTP_USERNAME' --env-password -p 21 '$STAGING_FTP_SERVER'; mkdir -p /wp-content/mu-plugins; put '$FILE' -o '/wp-content/mu-plugins/kp-mobile-emergency-gemini.php'; bye"
            curl --fail --silent --show-error --location -H 'Cache-Control: no-cache, no-store' 'https://neu.koblenzer-puppenspiele.de/?kp_emergency_deploy_check=1' >/dev/null
            echo 'Emergency Gemini endpoint deployed to staging only.'

workflows:
  staging-emergency-gemini-once:
    jobs:
      - deploy-emergency-gemini-staging:
          filters:
            branches:
              only:
                - staging/emergency-gemini-endpoint-20260825
