name: Autonomous homepage lab

on:
  workflow_run:
    workflows:
      - 'Deploy staging WordPress'
      - 'Owner all-controls persistence QA'
      - 'Touch slider staging QA'
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'qa/homepage-editor-lab.mjs'
      - 'qa/owner-all-persistence-e2e.mjs'
      - 'qa/touch-slider-hold-browser-test.mjs'
      - 'qa/touch-runtime-browser-test.mjs'
      - 'AGENTS.md'
      - '.github/workflows/homepage-autonomous-lab.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: koblenzer-puppenspiele-autonomous-homepage-lab
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve source commit and required browser suites
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = workflow_run ]; then
            source='${{ github.event.workflow_run.head_sha }}'
            force_suite=0
          else
            source="$GITHUB_SHA"
            force_suite=1
          fi
          git cat-file -e "${source}^{commit}"
          changed=$(git diff-tree --no-commit-id --name-only -r "$source" || true)
          plugin=0; touch=0
          if grep -q '^wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/' <<<"$changed"; then plugin=1; fi
          if grep -Eq 'touch-gesture-safety\.(js|css)$|qa/touch-slider-hold-browser-test\.mjs$' <<<"$changed"; then touch=1; fi
          if [ "$force_suite" = 1 ]; then plugin=1; touch=1; fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "require_owner=$plugin" >> "$GITHUB_OUTPUT"
          echo "require_touch=$touch" >> "$GITHUB_OUTPUT"
          echo "force_suite=$force_suite" >> "$GITHUB_OUTPUT"
          printf 'Source: %s\nRequire owner: %s\nRequire touch: %s\nChanged:\n%s\n' "$source" "$plugin" "$touch" "$changed"

      - name: Start full browser suite for infrastructure/manual checks
        if: steps.plan.outputs.force_suite == '1'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-staging.yml --ref main
          gh workflow run owner-all-persistence-staging-qa.yml --ref main
          gh workflow run touch-slider-staging-qa.yml --ref main
          echo 'Requested deploy/visual, owner persistence and native touch suites.'

      - name: Wait for required real-browser workflows
        id: wait
        env:
          SOURCE_SHA: ${{ steps.plan.outputs.source }}
          REQUIRE_OWNER: ${{ steps.plan.outputs.require_owner }}
          REQUIRE_TOUCH: ${{ steps.plan.outputs.require_touch }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          get_run() {
            local wf="$1"
            gh api -X GET "repos/$repo/actions/workflows/$wf/runs?head_sha=$SOURCE_SHA&per_page=20" \
              --jq '[.workflow_runs[] | select(.status == "completed")][0] | if . == null then "" else [.id,.conclusion,.event,.created_at] | @tsv end'
          }
          deploy=''; owner=''; touch=''
          for attempt in $(seq 1 72); do
            deploy=$(get_run deploy-staging.yml || true)
            if [ "$REQUIRE_OWNER" = 1 ]; then owner=$(get_run owner-all-persistence-staging-qa.yml || true); else owner=$'0\tnot-required\tn/a\tn/a'; fi
            if [ "$REQUIRE_TOUCH" = 1 ]; then touch=$(get_run touch-slider-staging-qa.yml || true); else touch=$'0\tnot-required\tn/a\tn/a'; fi
            if [ -n "$deploy" ] && [ -n "$owner" ] && [ -n "$touch" ]; then break; fi
            sleep 10
          done
          [ -n "$deploy" ] || { echo 'Deploy/visual workflow did not complete in time.' >&2; exit 1; }
          [ -n "$owner" ] || { echo 'Owner persistence workflow did not complete in time.' >&2; exit 1; }
          [ -n "$touch" ] || { echo 'Native touch workflow did not complete in time.' >&2; exit 1; }
          deploy_id=$(cut -f1 <<<"$deploy"); deploy_conclusion=$(cut -f2 <<<"$deploy")
          owner_id=$(cut -f1 <<<"$owner"); owner_conclusion=$(cut -f2 <<<"$owner")
          touch_id=$(cut -f1 <<<"$touch"); touch_conclusion=$(cut -f2 <<<"$touch")
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "deploy_conclusion=$deploy_conclusion" >> "$GITHUB_OUTPUT"
          echo "owner_id=$owner_id" >> "$GITHUB_OUTPUT"
          echo "owner_conclusion=$owner_conclusion" >> "$GITHUB_OUTPUT"
          echo "touch_id=$touch_id" >> "$GITHUB_OUTPUT"
          echo "touch_conclusion=$touch_conclusion" >> "$GITHUB_OUTPUT"
          echo "Deploy: $deploy"
          echo "Owner: $owner"
          echo "Touch: $touch"
          test "$deploy_conclusion" = success
          if [ "$REQUIRE_OWNER" = 1 ]; then test "$owner_conclusion" = success; fi
          if [ "$REQUIRE_TOUCH" = 1 ]; then test "$touch_conclusion" = success; fi

      - name: Read latest persisted QA evidence
        id: evidence
        env:
          REQUIRE_OWNER: ${{ steps.plan.outputs.require_owner }}
          REQUIRE_TOUCH: ${{ steps.plan.outputs.require_touch }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test -s qa-results/latest-report.json
          python - <<'PY'
          import json, sys
          with open('qa-results/latest-report.json',encoding='utf-8') as f: r=json.load(f)
          results=r.get('results') or []
          hard=[]
          for item in results:
              d=item.get('diagnostics') or {}
              if (item.get('status') or 0) >= 400 or item.get('errorTextDetected') or d.get('brokenImages') or (d.get('horizontalOverflowPx') or 0) > 0:
                  hard.append(f"{item.get('viewport')}/{item.get('page')}")
          print(f'Visual views={len(results)}, hard failures={len(hard)}')
          if len(results) < 50 or hard:
              print('Hard visual failures: '+', '.join(hard), file=sys.stderr)
              sys.exit(1)
          interactions=r.get('interactions') or []
          menu=[x for x in interactions if x.get('name')=='mobile-menu']
          if not menu or not menu[-1].get('buttonVisible') or not menu[-1].get('menuOpened'):
              print('Mobile menu visual interaction is not green.', file=sys.stderr); sys.exit(1)
          PY
          if [ "$REQUIRE_OWNER" = 1 ]; then
            test -s qa-results/owner-all-persistence-latest.md
            grep -Fq 'Persistenz-/Versionsprüfung: success' qa-results/owner-all-persistence-latest.md
          fi
          if [ "$REQUIRE_TOUCH" = 1 ]; then
            test -s qa-results/touch-slider-latest.md
            grep -Eq 'Echter Design-Tab / Wischen / Halten\+Ziehen: success|Wischen / Halten\+Ziehen: success' qa-results/touch-slider-latest.md
          fi
          echo 'Persisted visual/browser evidence is green.'

      - name: Persist one machine-readable autonomous lab result
        if: always()
        env:
          SOURCE_SHA: ${{ steps.plan.outputs.source }}
          REQUIRE_OWNER: ${{ steps.plan.outputs.require_owner }}
          REQUIRE_TOUCH: ${{ steps.plan.outputs.require_touch }}
          WAIT_OUTCOME: ${{ steps.wait.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          DEPLOY_ID: ${{ steps.wait.outputs.deploy_id }}
          DEPLOY_CONCLUSION: ${{ steps.wait.outputs.deploy_conclusion }}
          OWNER_ID: ${{ steps.wait.outputs.owner_id }}
          OWNER_CONCLUSION: ${{ steps.wait.outputs.owner_conclusion }}
          TOUCH_ID: ${{ steps.wait.outputs.touch_id }}
          TOUCH_CONCLUSION: ${{ steps.wait.outputs.touch_conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          success=false
          if [ "$WAIT_OUTCOME" = success ] && [ "$EVIDENCE_OUTCOME" = success ]; then success=true; fi
          jq -n \
            --arg generatedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg sourceCommit "$SOURCE_SHA" \
            --arg wait "$WAIT_OUTCOME" \
            --arg evidence "$EVIDENCE_OUTCOME" \
            --arg deployId "$DEPLOY_ID" --arg deploy "$DEPLOY_CONCLUSION" \
            --arg ownerId "$OWNER_ID" --arg owner "$OWNER_CONCLUSION" \
            --arg touchId "$TOUCH_ID" --arg touch "$TOUCH_CONCLUSION" \
            --arg requireOwner "$REQUIRE_OWNER" --arg requireTouch "$REQUIRE_TOUCH" \
            --argjson success "$success" \
            '{generatedAt:$generatedAt,sourceCommit:$sourceCommit,success:$success,checks:{workflowWait:$wait,persistedEvidence:$evidence},required:{owner:($requireOwner=="1"),touch:($requireTouch=="1")},runs:{deploy:{id:$deployId,conclusion:$deploy},owner:{id:$ownerId,conclusion:$owner},touch:{id:$touchId,conclusion:$touch}}}' \
            > /tmp/homepage-lab-latest.json
          {
            echo '# Autonomes Homepage-Labor – letzter Staging-Stand'
            echo
            echo "Erzeugt: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Quell-Commit: $SOURCE_SHA"
            echo "Gesamtstatus: $([ "$success" = true ] && echo GRÜN || echo ROT)"
            echo
            echo "- Deploy + 50-Ansichten Visual-QA: ${DEPLOY_CONCLUSION:-nicht abgeschlossen} (Run ${DEPLOY_ID:-?})"
            echo "- Echter Owner-Browser Speichern/Reload/DB/Undo/48h: ${OWNER_CONCLUSION:-nicht erforderlich} (Run ${OWNER_ID:-0})"
            echo "- Nativer Chromium-Touch-Regler + Reset/Save-Tap: ${TOUCH_CONCLUSION:-nicht erforderlich} (Run ${TOUCH_ID:-0})"
            echo "- Persistierte QA-Beweise geprüft: $EVIDENCE_OUTCOME"
            echo
            echo 'Produktion wurde von diesem Labor nicht verändert.'
          } > /tmp/homepage-lab-latest.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p qa-results
            cp /tmp/homepage-lab-latest.json qa-results/homepage-lab-latest.json
            cp /tmp/homepage-lab-latest.md qa-results/homepage-lab-latest.md
            git add qa-results/homepage-lab-latest.json qa-results/homepage-lab-latest.md
            if git diff --cached --quiet; then pushed=1; break; fi
            git commit -m 'qa: update autonomous homepage lab [skip ci]'
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 2
          done
          test "$pushed" = 1
          test "$success" = true
