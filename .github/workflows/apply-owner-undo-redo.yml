name: Apply owner undo redo upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-owner-undo-redo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch owner history and controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          php_path = Path('wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-history.php')
          s = php_path.read_text()
          s = s.replace("    const OPTION = 'kp_owner_history_v1';\n    const RETENTION = 172800; // 48 hours.\n    const MAX_ITEMS = 80;\n", "    const OPTION = 'kp_owner_history_v1';\n    const REDO_OPTION = 'kp_owner_history_redo_v1';\n    const RETENTION = 172800; // 48 hours.\n    const MAX_ITEMS = 80;\n    const NAV_LIMIT = 50;\n")
          s = s.replace("        add_action( 'wp_ajax_kp_owner_history_undo', array( __CLASS__, 'ajax_undo' ) );\n        add_action( 'wp_ajax_kp_owner_history_restore', array( __CLASS__, 'ajax_restore' ) );\n", "        add_action( 'wp_ajax_kp_owner_history_undo', array( __CLASS__, 'ajax_undo' ) );\n        add_action( 'wp_ajax_kp_owner_history_redo', array( __CLASS__, 'ajax_redo' ) );\n        add_action( 'wp_ajax_kp_owner_history_restore', array( __CLASS__, 'ajax_restore' ) );\n")
          s = s.replace("    private static function items() {\n        return self::prune( get_option( self::OPTION, array() ) );\n    }\n\n    private static function target_entity() {\n        $id = isset( $_POST['id'] ) ? absint( $_POST['id'] ) : 0;\n", "    private static function items() {\n        return self::prune( get_option( self::OPTION, array() ) );\n    }\n\n    private static function redo_items() {\n        $items = get_option( self::REDO_OPTION, array() );\n        if ( ! is_array( $items ) ) { return array(); }\n        return array_slice( array_values( $items ), -self::NAV_LIMIT );\n    }\n\n    private static function target_entity( $forced_id = 0 ) {\n        $id = $forced_id ? absint( $forced_id ) : ( isset( $_POST['id'] ) ? absint( $_POST['id'] ) : 0 );\n")
          s = s.replace("    private static function state() {\n", "    private static function state( $forced_entity_id = 0 ) {\n")
          s = s.replace("            'entity'  => self::target_entity(),\n", "            'entity'  => self::target_entity( $forced_entity_id ),\n")
          s = s.replace("        update_option( self::OPTION, $items, false );\n        return $id;\n", "        update_option( self::OPTION, $items, false );\n        update_option( self::REDO_OPTION, array(), false );\n        return $id;\n", 1)
          s = s.replace("                'undo'  => $index < 10,\n", "                'undo'  => $index < self::NAV_LIMIT,\n")
          s = s.replace("            'undo_steps' => min( 10, count( $items ) ),\n", "            'undo_steps' => min( self::NAV_LIMIT, count( $items ) ),\n            'redo_steps' => min( self::NAV_LIMIT, count( self::redo_items() ) ),\n")
          old_undo = """    public static function ajax_undo() {\n        self::authorize();\n        $items = self::items();\n        if ( ! $items ) { wp_send_json_error( array( 'message' => 'Keine gespeicherte Änderung zum Rückgängigmachen vorhanden.' ), 404 ); }\n        $item = array_pop( $items );\n        if ( ! self::restore_state( isset( $item['state'] ) ? $item['state'] : array() ) ) {\n            wp_send_json_error( array( 'message' => 'Der vorherige Stand konnte nicht vollständig wiederhergestellt werden.' ), 500 );\n        }\n        update_option( self::OPTION, self::prune( $items ), false );\n        wp_send_json_success( array(\n            'message' => 'Letzte Speicherung rückgängig ✓',\n            'restored' => array( 'id' => $item['id'], 'ts' => $item['ts'], 'label' => $item['label'] ),\n            'remaining_undo_steps' => min( 10, count( $items ) ),\n        ) );\n    }\n"""
          new_undo = """    public static function ajax_undo() {\n        self::authorize();\n        $items = self::items();\n        if ( ! $items ) { wp_send_json_error( array( 'message' => 'Keine gespeicherte Änderung zum Rückgängigmachen vorhanden.' ), 404 ); }\n        $item = array_pop( $items );\n        $entity_id = ! empty( $item['state']['entity']['id'] ) ? absint( $item['state']['entity']['id'] ) : 0;\n        $redo = self::redo_items();\n        $redo[] = array(\n            'id' => gmdate( 'YmdHis' ) . '-redo-' . wp_generate_password( 6, false, false ),\n            'ts' => time(),\n            'label' => isset( $item['label'] ) ? (string) $item['label'] : 'Website geändert',\n            'state' => self::state( $entity_id ),\n        );\n        $redo = array_slice( $redo, -self::NAV_LIMIT );\n        if ( ! self::restore_state( isset( $item['state'] ) ? $item['state'] : array() ) ) {\n            wp_send_json_error( array( 'message' => 'Der vorherige Stand konnte nicht vollständig wiederhergestellt werden.' ), 500 );\n        }\n        update_option( self::OPTION, self::prune( $items ), false );\n        update_option( self::REDO_OPTION, $redo, false );\n        wp_send_json_success( array(\n            'message' => 'Rückgängig ✓',\n            'remaining_undo_steps' => min( self::NAV_LIMIT, count( $items ) ),\n            'redo_steps' => min( self::NAV_LIMIT, count( $redo ) ),\n        ) );\n    }\n\n    public static function ajax_redo() {\n        self::authorize();\n        $redo = self::redo_items();\n        if ( ! $redo ) { wp_send_json_error( array( 'message' => 'Nichts mehr zum Wiederholen vorhanden.' ), 404 ); }\n        $target = array_pop( $redo );\n        $entity_id = ! empty( $target['state']['entity']['id'] ) ? absint( $target['state']['entity']['id'] ) : 0;\n        $items = self::items();\n        $current = self::state( $entity_id );\n        $items[] = array(\n            'id' => gmdate( 'YmdHis' ) . '-redo-base-' . wp_generate_password( 6, false, false ),\n            'ts' => time(),\n            'label' => isset( $target['label'] ) ? (string) $target['label'] : 'Website geändert',\n            'user' => get_current_user_id(),\n            'group' => '',\n            'checksum' => self::checksum( $current ),\n            'state' => $current,\n        );\n        if ( ! self::restore_state( isset( $target['state'] ) ? $target['state'] : array() ) ) {\n            wp_send_json_error( array( 'message' => 'Der nächste Stand konnte nicht vollständig wiederhergestellt werden.' ), 500 );\n        }\n        update_option( self::OPTION, self::prune( $items ), false );\n        update_option( self::REDO_OPTION, $redo, false );\n        wp_send_json_success( array(\n            'message' => 'Wiederholt ✓',\n            'undo_steps' => min( self::NAV_LIMIT, count( $items ) ),\n            'remaining_redo_steps' => min( self::NAV_LIMIT, count( $redo ) ),\n        ) );\n    }\n"""
          if old_undo not in s:
              raise SystemExit('Expected ajax_undo block not found')
          s = s.replace(old_undo, new_undo)
          php_path.write_text(s)

          js_path = Path('wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/owner-save-coordinator.js')
          j = js_path.read_text()
          old_inject = """  function injectHistoryButtons() {\n    const grid=q('.kp-oa-action-grid');\n    if(!grid||grid.dataset.kpHistory==='1')return;\n    grid.dataset.kpHistory='1';\n    const undo=document.createElement('button');\n    undo.type='button';undo.dataset.kpHistoryUndo='1';\n    undo.innerHTML='<span>↶</span><strong>Speichern rückgängig</strong><small>Bis zu 10 Speicherungen zurück</small>';\n    const versions=document.createElement('button');\n    versions.type='button';versions.dataset.kpHistoryVersions='1';\n    versions.innerHTML='<span>🕘</span><strong>Versionen</strong><small>Stände der letzten 48 Stunden</small>';\n    grid.append(undo,versions);\n  }\n\n  async function undoSaved() {\n    if(!confirm('Die letzte gespeicherte Änderung wirklich rückgängig machen?'))return;\n    try{\n      const data=await api('kp_owner_history_undo');\n      toast(data.message||'Letzte Speicherung rückgängig ✓','ok');\n      setTimeout(()=>location.reload(),450);\n    }catch(error){toast(error.message,'error');}\n  }\n"""
          new_inject = """  async function refreshHistoryButtons() {\n    const undo=q('[data-kp-history-undo]');\n    const redo=q('[data-kp-history-redo]');\n    if(!undo&&!redo)return;\n    try{\n      const data=await api('kp_owner_history_list');\n      if(undo){undo.disabled=!(Number(data.undo_steps)||0);undo.title=`Rückgängig (${Number(data.undo_steps)||0} verfügbar)`;}\n      if(redo){redo.disabled=!(Number(data.redo_steps)||0);redo.title=`Wiederholen (${Number(data.redo_steps)||0} verfügbar)`;}\n    }catch(_){ }\n  }\n\n  function injectHistoryButtons() {\n    const actions=q('.kp-oa-sticky-actions');\n    if(actions&&actions.dataset.kpHistory!=='1'){\n      actions.dataset.kpHistory='1';\n      const undo=document.createElement('button');\n      undo.type='button';undo.className='kp-oa-secondary kp-oa-history-nav';undo.dataset.kpHistoryUndo='1';\n      undo.setAttribute('aria-label','Rückgängig');undo.innerHTML='<span aria-hidden=\"true\">↶</span><span>Zurück</span>';\n      const redo=document.createElement('button');\n      redo.type='button';redo.className='kp-oa-secondary kp-oa-history-nav';redo.dataset.kpHistoryRedo='1';\n      redo.setAttribute('aria-label','Wiederholen');redo.innerHTML='<span aria-hidden=\"true\">↷</span><span>Vor</span>';\n      const save=q('.kp-oa-design-save',actions);\n      actions.insertBefore(undo,save||null);actions.insertBefore(redo,save||null);\n      refreshHistoryButtons();\n    }\n    const grid=q('.kp-oa-action-grid');\n    if(grid&&grid.dataset.kpVersions!=='1'){\n      grid.dataset.kpVersions='1';\n      const versions=document.createElement('button');\n      versions.type='button';versions.dataset.kpHistoryVersions='1';\n      versions.innerHTML='<span>🕘</span><strong>Versionen</strong><small>Stände der letzten 48 Stunden</small>';\n      grid.append(versions);\n    }\n  }\n\n  async function undoSaved() {\n    try{\n      const data=await api('kp_owner_history_undo');\n      toast(data.message||'Rückgängig ✓','ok');\n      setTimeout(()=>location.reload(),250);\n    }catch(error){toast(error.message,'error');refreshHistoryButtons();}\n  }\n\n  async function redoSaved() {\n    try{\n      const data=await api('kp_owner_history_redo');\n      toast(data.message||'Wiederholt ✓','ok');\n      setTimeout(()=>location.reload(),250);\n    }catch(error){toast(error.message,'error');refreshHistoryButtons();}\n  }\n"""
          if old_inject not in j:
              raise SystemExit('Expected history controls block not found')
          j = j.replace(old_inject, new_inject)
          j = j.replace("Die neuesten ${Math.min(10,items.length)} Stände kannst du außerdem Schritt für Schritt rückgängig machen.", "Mit Zurück/Vor kannst du mindestens 20 Schritte navigieren; Versionen bleiben zusätzlich 48 Stunden erhalten.")
          j = j.replace("${index<10?' · Rückgängig-Schritt':''}", "${index<50?' · Verlaufsschritt':''}")
          j = j.replace("    if(target?.closest('[data-kp-history-undo]'))undoSaved();\n    if(target?.closest('[data-kp-history-versions]'))showVersions();\n", "    if(target?.closest('[data-kp-history-undo]'))undoSaved();\n    if(target?.closest('[data-kp-history-redo]'))redoSaved();\n    if(target?.closest('[data-kp-history-versions]'))showVersions();\n")
          js_path.write_text(j)
          PY
          php -l wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-history.php
          node --check wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/owner-save-coordinator.js
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-owner-undo-redo.yml
          git config user.name 'homepage-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Word-style owner undo redo history'
          git push
