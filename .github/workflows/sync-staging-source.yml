name: Sync current staging source into repository

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-staging-source.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install secure FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Download current Koblenzer Puppenspiele plugin and theme
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p wp-content/plugins/koblenzer-puppenspiele-core-phase2-2
          mkdir -p wp-content/themes/koblenzer-puppenspiele-block-theme-phase1-7
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            open --user '$FTP_USERNAME' --env-password -p 21 srv26.dsbsrv.de;
            mirror --verbose --delete --parallel=2 /wp-content/plugins/koblenzer-puppenspiele-core-phase2-2 wp-content/plugins/koblenzer-puppenspiele-core-phase2-2;
            mirror --verbose --delete --parallel=2 /wp-content/themes/koblenzer-puppenspiele-block-theme-phase1-7 wp-content/themes/koblenzer-puppenspiele-block-theme-phase1-7;
            bye;
          "

      - name: Commit synchronized source if changed
        run: |
          set -euo pipefail
          git config user.name 'Koblenzer Puppenspiele Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add wp-content/plugins/koblenzer-puppenspiele-core-phase2-2 wp-content/themes/koblenzer-puppenspiele-block-theme-phase1-7
          if git diff --cached --quiet; then
            echo 'Repository already matches staging source.'
            exit 0
          fi
          git commit -m 'Sync current WordPress plugin and theme from staging'
          git push origin HEAD:main
