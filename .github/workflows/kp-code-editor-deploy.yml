# Cloud Live voice, screen sharing and optional image API; staging only.
name: KP staging code editor API
on:
  push:
    branches: [codex/kp-editor-ai-staging]
    paths:
      - .github/workflows/kp-code-editor-deploy.yml
      - deployments/kp-code-editor/**
      - deployments/kp-menu-corners/modern.html
      - android/kp-studio-cloud/**
      - tests/kp-cloud-live/**
permissions:
  contents: read
concurrency:
  group: kp-code-editor-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KP_FTP_PASSWORD: ${{ secrets.KP_TEST_FTP_PASSWORD }}
      KP_FTP_USERNAME: ${{ secrets.KP_TEST_FTP_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard and syntax checks
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/kp-editor-ai-staging
          test "$KP_FTP_USERNAME" = web16_ftpneu
          test -n "$KP_FTP_PASSWORD"
          php -l deployments/kp-code-editor/ai-draft.php
          node --check deployments/kp-code-editor/kp-code-panel.js
          node --check deployments/kp-code-editor/kp-ai-panel.js
          node --check deployments/kp-code-editor/kp-ai-live.js
          node --check deployments/kp-code-editor/kp-ai-audio-worklet.js
          node tests/kp-cloud-live/audio-worklet.mjs
          python tests/kp-cloud-live/api-auth.py
          node --check deployments/kp-code-editor/kp-background-lib.js
          node --check deployments/kp-code-editor/kp-background-worker.js
      - name: Prepare verified staging backup
        if: contains(github.event.head_commit.message, '[kp-code-upload]')
        run: |
          set -euo pipefail
          cat > /tmp/kp-ai-deploy.py <<'PY'
          import ftplib, hashlib, io, json, os, pathlib, ssl, sys
          files = {
              "kp-ai-live.js": "deployments/kp-code-editor/kp-ai-live.js",
              "kp-ai-audio-worklet.js": "deployments/kp-code-editor/kp-ai-audio-worklet.js",
              "kp-ai-panel.css": "deployments/kp-code-editor/kp-ai-panel.css",
              "kp-code-panel.js": "deployments/kp-code-editor/kp-code-panel.js",
              "kp-code-panel.css": "deployments/kp-code-editor/kp-code-panel.css",
              "kp-ai-panel.js": "deployments/kp-code-editor/kp-ai-panel.js",
              "api/ai-draft.php": "deployments/kp-code-editor/ai-draft.php",
          }
          expected = {'api/ai-draft.php': 'abc30852e81b627b098430d0b61bd4278c27387b2d863bcfc9919907799bea2a', 'kp-ai-live.js': '40ff2cb40f96c7db19fbfdbea661dd2bb9cd18d2439f3974ce21d8986ff96c7b', 'kp-ai-audio-worklet.js': '1bdb2ea7b59a1d396e72bc0dc0633f3cf050c9e91e5d9735b25714bf3d008f01', 'kp-ai-panel.css': '241ff60ffbe6b4ad6f1c93d57e02c4e312375cb96656d3a13941619a541da318', 'kp-code-panel.js': '5b649adb8ac62ce081316c88a86f52b4b14d370eb5199c531df4f445b8b0bcd3', 'kp-code-panel.css': 'bbff574c3c27a0402b67c287754c39ddbff547a74fc571673e0a0c2eb62d6df1', 'kp-ai-panel.js': 'aaa8cfbb8dc7f83286dd1b2d28aa9fa97513a5e4aeac105c7962d202389f470e'}
          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=30)
          ftp.connect("srv26.dsbsrv.de", 21)
          ftp.login(os.environ["KP_FTP_USERNAME"], os.environ["KP_FTP_PASSWORD"])
          ftp.prot_p()
          def read(path):
              out = io.BytesIO()
              try:
                  ftp.retrbinary("RETR " + path, out.write)
              except ftplib.error_perm as error:
                  if str(error).startswith("550"):
                      return None
                  raise
              return out.getvalue()
          def digest(data):
              return hashlib.sha256(data).hexdigest() if data is not None else None
          backup = pathlib.Path("backup")
          if sys.argv[1] == "backup":
              backup.mkdir()
              manifest = {}
              mismatches = []
              for remote in files:
                  data = read(remote)
                  sha = digest(data)
                  if remote in expected and sha != expected[remote]:
                      mismatches.append("Staging changed: " + remote + " actual SHA256 " + str(sha))
                  if remote not in expected and data is not None:
                      mismatches.append("AI file already exists; review before replacing: " + remote)
                  manifest[remote] = sha
                  if data is not None:
                      target = backup / remote
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(data)
              (backup / "manifest.json").write_text(json.dumps(manifest))
              if mismatches:
                  raise RuntimeError("; ".join(mismatches))
          else:
              manifest = json.loads((backup / "manifest.json").read_text())
              for remote, sha in manifest.items():
                  if digest(read(remote)) != sha:
                      raise RuntimeError("Staging changed since backup: " + remote)
              touched = []
              try:
                  for remote, local in sorted(files.items(), key=lambda item: item[0]=="modern.html"):
                      touched.append(remote)
                      data = pathlib.Path(local).read_bytes()
                      ftp.storbinary("STOR " + remote, io.BytesIO(data))
                      if read(remote) != data:
                          raise RuntimeError("Upload readback failed: " + remote)
              except BaseException:
                  for remote in reversed(touched):
                      if manifest[remote] is None:
                          ftp.delete(remote)
                      else:
                          data = (backup / remote).read_bytes()
                          ftp.storbinary("STOR " + remote, io.BytesIO(data))
                          if read(remote) != data:
                              raise RuntimeError("Rollback readback failed: " + remote)
                  raise
              print("Verified AI upload: " + ", ".join(files))
          ftp.quit()
          PY
          python /tmp/kp-ai-deploy.py backup
      - name: Retain verified backup
        if: always() && contains(github.event.head_commit.message, '[kp-code-upload]')
        uses: actions/upload-artifact@v4
        with:
          name: kp-ai-before-${{ github.run_id }}
          path: backup/
          retention-days: 30
          if-no-files-found: error
      - name: Upload AI files with readback and rollback
        if: contains(github.event.head_commit.message, '[kp-code-upload]')
        run: |
          set -euo pipefail
          python /tmp/kp-ai-deploy.py upload
          status=$(curl -sS -o /tmp/anonymous-ai.json -w '%{http_code}' --max-time 20 'https://neu.koblenzer-puppenspiele.de/api/ai-draft.php')
          test "$status" = 401

