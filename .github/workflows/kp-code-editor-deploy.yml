name: KP staging code editor API
on:
  push:
    branches: [codex/kp-editor-ai-staging]
    paths:
      - .github/workflows/kp-code-editor-deploy.yml
      - deployments/kp-code-editor/**
      - deployments/kp-menu-corners/modern.html
permissions:
  contents: read
concurrency:
  group: kp-code-editor-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KP_FTP_PASSWORD: ${{ secrets.KP_TEST_FTP_PASSWORD }}
      KP_FTP_USERNAME: ${{ secrets.KP_TEST_FTP_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard and syntax checks
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/kp-editor-ai-staging
          test "$KP_FTP_USERNAME" = web16_ftpneu
          test -n "$KP_FTP_PASSWORD"
          php -l deployments/kp-code-editor/ai-draft.php
          node --check deployments/kp-code-editor/kp-code-panel.js
          node --check deployments/kp-code-editor/kp-ai-panel.js
      - name: Prepare verified staging backup
        if: contains(github.event.head_commit.message, '[kp-code-upload]')
        run: |
          set -euo pipefail
          cat > /tmp/kp-ai-deploy.py <<'PY'
          import ftplib, hashlib, io, json, os, pathlib, ssl, sys
          files = {
              "modern.html": "deployments/kp-menu-corners/modern.html",
              "kp-ai-panel.js": "deployments/kp-code-editor/kp-ai-panel.js",
              "kp-ai-panel.css": "deployments/kp-code-editor/kp-ai-panel.css",
              "api/ai-draft.php": "deployments/kp-code-editor/ai-draft.php",
          }
          expected = {
              "modern.html": "a03ba4ebd1a942a368ef3c7c80217d55476233224686172989e07e2e2143f3e8",
              "kp-ai-panel.js": "4c8cbff832674bb92c328137c695715736aa2edc43ddf23f6f1b190f47c62d38",
              "kp-ai-panel.css": "abf0a1c43b3576ac943f47ccb4172bcc3e0aad75734f81114a45848f7329b01c",
              "api/ai-draft.php": "1dd877df7f07b2262c36d471c9afc3fa4fcad58dea77d3bd5ca7681e23030d3f",
          }
          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=30)
          ftp.connect("srv26.dsbsrv.de", 21)
          ftp.login(os.environ["KP_FTP_USERNAME"], os.environ["KP_FTP_PASSWORD"])
          ftp.prot_p()
          def read(path):
              out = io.BytesIO()
              try:
                  ftp.retrbinary("RETR " + path, out.write)
              except ftplib.error_perm as error:
                  if str(error).startswith("550"):
                      return None
                  raise
              return out.getvalue()
          def digest(data):
              return hashlib.sha256(data).hexdigest() if data is not None else None
          backup = pathlib.Path("backup")
          if sys.argv[1] == "backup":
              backup.mkdir()
              manifest = {}
              for remote in files:
                  data = read(remote)
                  sha = digest(data)
                  if remote in expected and sha != expected[remote]:
                      raise RuntimeError("Staging changed: " + remote)
                  if remote not in expected and data is not None:
                      raise RuntimeError("AI file already exists; review before replacing: " + remote)
                  manifest[remote] = sha
                  if data is not None:
                      target = backup / remote
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(data)
              (backup / "manifest.json").write_text(json.dumps(manifest))
          else:
              manifest = json.loads((backup / "manifest.json").read_text())
              for remote, sha in manifest.items():
                  if digest(read(remote)) != sha:
                      raise RuntimeError("Staging changed since backup: " + remote)
              touched = []
              try:
                  for remote, local in files.items():
                      touched.append(remote)
                      data = pathlib.Path(local).read_bytes()
                      ftp.storbinary("STOR " + remote, io.BytesIO(data))
                      if read(remote) != data:
                          raise RuntimeError("Upload readback failed: " + remote)
              except BaseException:
                  for remote in reversed(touched):
                      if manifest[remote] is None:
                          ftp.delete(remote)
                      else:
                          data = (backup / remote).read_bytes()
                          ftp.storbinary("STOR " + remote, io.BytesIO(data))
                          if read(remote) != data:
                              raise RuntimeError("Rollback readback failed: " + remote)
                  raise
              print("Verified AI upload: " + ", ".join(files))
          ftp.quit()
          PY
          python /tmp/kp-ai-deploy.py backup
      - name: Retain verified backup
        if: contains(github.event.head_commit.message, '[kp-code-upload]')
        uses: actions/upload-artifact@v4
        with:
          name: kp-ai-before-${{ github.run_id }}
          path: backup/
          retention-days: 30
          if-no-files-found: error
      - name: Upload AI files with readback and rollback
        if: contains(github.event.head_commit.message, '[kp-code-upload]')
        run: |
          set -euo pipefail
          python /tmp/kp-ai-deploy.py upload
          status=$(curl -sS -o /tmp/anonymous-ai.json -w '%{http_code}' --max-time 20 'https://neu.koblenzer-puppenspiele.de/api/ai-draft.php')
          test "$status" = 401
