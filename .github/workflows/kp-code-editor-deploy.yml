name: KP staging code editor API
on:
  push:
    branches: [codex/kp-editor-ai-staging]
    paths:
      - .github/workflows/kp-code-editor-deploy.yml
      - deployments/kp-code-editor/**
      - deployments/kp-menu-corners/modern.html
permissions:
  contents: read
concurrency:
  group: kp-code-editor-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LFTP_PASSWORD: ${{ secrets.KP_TEST_FTP_PASSWORD }}
      FTP_USERNAME: ${{ secrets.KP_TEST_FTP_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard target and check PHP syntax
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/kp-editor-ai-staging
          test "$FTP_USERNAME" = web16_ftpneu
          test -n "$LFTP_PASSWORD"
          php -l deployments/kp-code-editor/code-editor.php
          node --check deployments/kp-code-editor/kp-code-panel.js
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends lftp
      - name: Save any existing test API
        run: |
          mkdir -p /tmp/previous
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 20;
            open --user web16_ftpneu --env-password -p 21 srv26.dsbsrv.de;
            get api/code-editor.php -o /tmp/previous/code-editor.php;
            bye
          " || true
      - name: Keep existing version if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kp-code-editor-previous
          path: /tmp/previous/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify and back up current staging HTML
        run: |
          set -euo pipefail
          mkdir -p /tmp/kp-html-before
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            open --user web16_ftpneu --env-password -p 21 srv26.dsbsrv.de;
            get modern.html -o /tmp/kp-html-before/modern.html;
            bye
          "
          echo '6181ff848bc222ea7c050bd743139251dd2b9f834dfca481bab166baca62d483  /tmp/kp-html-before/modern.html' | sha256sum -c -
      - name: Retain staging HTML backup
        uses: actions/upload-artifact@v4
        with:
          name: kp-html-before-${{ github.run_id }}
          path: /tmp/kp-html-before/modern.html
          retention-days: 14
          if-no-files-found: error
      - name: Upload staging API and verify anonymous denial
        run: |
          set -euo pipefail
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 20;
            open --user web16_ftpneu --env-password -p 21 srv26.dsbsrv.de;
            put deployments/kp-code-editor/code-editor.php -o api/code-editor.php;
            get api/code-editor.php -o /tmp/readback.php;
            bye
          "
          cmp deployments/kp-code-editor/code-editor.php /tmp/readback.php
          status=$(curl -sS -o /tmp/anonymous.json -w '%{http_code}' --max-time 20 'https://neu.koblenzer-puppenspiele.de/api/code-editor.php?file=modern.html')
          echo "Anonymous request returned HTTP $status"
          test "$status" = 401
          python3 - <<'PY'
          import json
          with open('/tmp/anonymous.json') as f:
              data=json.load(f)
          assert data.get('error') == 'Admin-Anmeldung erforderlich.', data
          PY
      - name: Upload code panel and HTML only after backup
        run: |
          set -euo pipefail
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 20;
            open --user web16_ftpneu --env-password -p 21 srv26.dsbsrv.de;
            put deployments/kp-code-editor/kp-code-panel.css -o kp-code-panel.css;
            put deployments/kp-code-editor/kp-code-panel.js -o kp-code-panel.js;
            put deployments/kp-menu-corners/modern.html -o modern.html;
            get kp-code-panel.css -o /tmp/panel.css;
            get kp-code-panel.js -o /tmp/panel.js;
            get modern.html -o /tmp/modern.html;
            bye
          "
          cmp deployments/kp-code-editor/kp-code-panel.css /tmp/panel.css
          cmp deployments/kp-code-editor/kp-code-panel.js /tmp/panel.js
          cmp deployments/kp-menu-corners/modern.html /tmp/modern.html
      - name: Remove new endpoint if verification failed
        if: failure()
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            open --user web16_ftpneu --env-password -p 21 srv26.dsbsrv.de;
            rm -f api/code-editor.php;
            bye
          "
