name: Deploy staging WordPress

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/**'
      - 'wp-content/themes/koblenzer-puppenspiele-block-theme-phase1-7/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

concurrency:
  group: koblenzer-puppenspiele-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FTP_SERVER: srv26.dsbsrv.de

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify deployable WordPress code exists
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN='wp-content/plugins/koblenzer-puppenspiele-core-phase2-2'
          THEME='wp-content/themes/koblenzer-puppenspiele-block-theme-phase1-7'

          found=0
          if [ -d "$PLUGIN" ]; then
            echo "Plugin found: $PLUGIN"
            found=1
          fi
          if [ -d "$THEME" ]; then
            echo "Theme found: $THEME"
            found=1
          fi

          if [ "$found" -ne 1 ]; then
            echo 'ERROR: Neither the expected plugin nor theme directory exists in this repository.'
            echo 'Nothing will be uploaded.'
            exit 1
          fi

      - name: PHP syntax safety check
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/plugins/koblenzer-puppenspiele-core-phase2-2 \
               wp-content/themes/koblenzer-puppenspiele-block-theme-phase1-7 \
               -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Install secure FTP client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Diagnose explicit FTPS connection safely
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FTP_USERNAME:?FTP_USERNAME secret is missing}"
          : "${LFTP_PASSWORD:?FTP_PASSWORD secret is missing}"

          echo "Testing explicit FTPS on port 21 against ${FTP_SERVER}…"

          set +e
          OUTPUT=$(lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 1;
            set net:timeout 15;
            open --user '$FTP_USERNAME' --env-password -p 21 '$FTP_SERVER';
            cls -1;
            bye
          " 2>&1)
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ]; then
            SAFE_OUTPUT="${OUTPUT//$FTP_USERNAME/***}"
            SAFE_OUTPUT="${SAFE_OUTPUT//$'\n'/' | '}"
            echo "::error title=FTPS connection failed::$SAFE_OUTPUT"
            exit "$STATUS"
          fi

          echo 'FTPS authentication and directory listing succeeded.'

      - name: Deploy plugin and theme to staging via explicit FTPS
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN='wp-content/plugins/koblenzer-puppenspiele-core-phase2-2'
          THEME='wp-content/themes/koblenzer-puppenspiele-block-theme-phase1-7'

          deploy_dir() {
            local source_dir="$1"
            local target_dir="$2"

            lftp -c "
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate true;
              set net:max-retries 2;
              set net:timeout 20;
              open --user '$FTP_USERNAME' --env-password -p 21 '$FTP_SERVER';
              mirror -R --verbose --only-newer --parallel=2 '$source_dir' '$target_dir';
              bye
            "
          }

          if [ -d "$PLUGIN" ]; then
            echo 'Deploying plugin…'
            deploy_dir "$PLUGIN" '/wp-content/plugins/koblenzer-puppenspiele-core-phase2-2'
          fi

          if [ -d "$THEME" ]; then
            echo 'Deploying theme…'
            deploy_dir "$THEME" '/wp-content/themes/koblenzer-puppenspiele-block-theme-phase1-7'
          fi

      - name: Verify staging website, routes and expected content
        shell: bash
        run: |
          set -euo pipefail

          check_page() {
            local url="$1"
            local expected="${2:-}"
            local body
            body=$(mktemp)
            echo "Checking $url"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 5 --max-time 90 \
              "$url" --output "$body"
            test -s "$body"
            if grep -qiE 'kritischen Fehler|critical error|fatal error|parse error' "$body"; then
              echo "ERROR: WordPress/PHP error text detected on $url"
              exit 1
            fi
            if [ -n "$expected" ] && ! grep -Fqi "$expected" "$body"; then
              echo "ERROR: Expected content '$expected' was not found on $url"
              exit 1
            fi
            rm -f "$body"
          }

          check_page 'https://neu.koblenzer-puppenspiele.de/'
          check_page 'https://neu.koblenzer-puppenspiele.de/aktuelles/' 'FREUNDE'
          check_page 'https://neu.koblenzer-puppenspiele.de/das-theater/' 'Figurentheater aus Leidenschaft'
          check_page 'https://neu.koblenzer-puppenspiele.de/das-theater/' 'Björn Christian Küpper'
          check_page 'https://neu.koblenzer-puppenspiele.de/repertoire/' 'Nulli und Priesemut'
          check_page 'https://neu.koblenzer-puppenspiele.de/termine/' 'Osterspai'
          check_page 'https://neu.koblenzer-puppenspiele.de/referenzen/' 'Kufa'
          check_page 'https://neu.koblenzer-puppenspiele.de/jetzt-buchen/' 'Figurentheater direkt bei Ihnen'
          check_page 'https://neu.koblenzer-puppenspiele.de/kontakt/'

          echo 'All staging routes respond and expected core content is present.'
