name: Standalone Webapp History Browser QA
on:
  push:
    branches: [webapp-no-wordpress-test]
    paths: ['webapp/**','.github/workflows/webapp-history-browser-qa.yml']
permissions: {contents: read}
jobs:
  history-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Capture published v32 history behavior
        run: |
          cat > /tmp/qa.mjs <<'JS'
          import{chromium}from'playwright';import{writeFileSync}from'fs';const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:412,height:915},isMobile:true,hasTouch:true});let ready=false;for(let i=0;i<45;i++){await p.goto('https://sebastianmoschek-hash.github.io/koblenzer-puppenspiele-wordpress/?qa='+Date.now(),{waitUntil:'networkidle'});ready=await p.evaluate(()=>typeof __kpHistory?.reset==='function'&&!!document.querySelector('script[src*="20260912-32"]'));if(ready)break;await p.waitForTimeout(2000)}if(!ready)throw Error('v32 not ready');const r=await p.evaluate(()=>{const a=__kpHistory,e=document.querySelector('main h1');a.reset();const original=e.style.transform;for(let i=1;i<=5;i++){let d=a.checkpoint();e.style.transform=`translate(${i*3}px, ${i*2}px)`;d()}const after5=a.state(),us=[];for(let i=0;i<5;i++){a.undo();us.push(a.state())}const afterUndo=document.querySelector('main h1').style.transform,rs=[];for(let i=0;i<5;i++){a.redo();rs.push(a.state())}const afterRedo=document.querySelector('main h1').style.transform;let mixed=[],t=document.querySelector('main h1'),d=a.checkpoint();t.textContent+=' QA';d();mixed.push('text');const x=document.querySelector('main a.btn,main .btn,main a');if(x){d=a.checkpoint();x.style.transform='translate(7px, 4px)';d();mixed.push('button-move');d=a.checkpoint();x.textContent=(x.textContent||'Button')+' QA';d();mixed.push('button-label')}t=document.querySelector('main h1');d=a.checkpoint();t.style.width='88%';d();mixed.push('resize');d=a.checkpoint();t.style.opacity='.91';d();mixed.push('design');for(let i=0;i<mixed.length;i++)a.undo();const mu=a.state();for(let i=0;i<mixed.length;i++)a.redo();const mr=a.state();return{original,after5,us,afterUndo,rs,afterRedo,mixed,mu,mr}});writeFileSync('/tmp/result.json',JSON.stringify(r));console.log(r);await b.close();
          JS
          node /tmp/qa.mjs
      - name: Assert five history steps
        run: jq -e '.after5.undo==5 and .after5.redo==0' /tmp/result.json
      - name: Assert five sequential undos
        run: jq -e '.afterUndo==.original and ([.us[].undo]|join(","))=="4,3,2,1,0"' /tmp/result.json
      - name: Assert five sequential redos
        run: jq -e '.afterRedo=="translate(15px, 10px)" and ([.rs[].redo]|join(","))=="4,3,2,1,0"' /tmp/result.json
      - name: Assert mixed text button resize design undo redo
        run: jq -e '(.mixed|length)>=5 and .mu.redo==(.mixed|length) and .mr.redo==0' /tmp/result.json
