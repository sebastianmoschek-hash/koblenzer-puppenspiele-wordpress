name: Fast Standalone Webapp FTPS Deploy

# FTPS is intentionally manual. Normal development on webapp-no-wordpress-test
# is published only through GitHub Pages until the test-domain deploy is approved.
on:
  workflow_dispatch:

concurrency:
  group: standalone-webapp-ftps-test-fast
  cancel-in-progress: true

jobs:
  deploy-test-site:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    env:
      EXPECTED_BRANCH: webapp-no-wordpress-test
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: webapp-no-wordpress-test
          fetch-depth: 1

      - name: Hard safety guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$EXPECTED_BRANCH" != "main"
          test -f webapp/index.html
          echo "Fast deploy safety guard passed."

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lftp

      - name: Fast deploy webapp only to jailed test FTP root
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.KP_TEST_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.KP_TEST_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.KP_TEST_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER:21" <<'LFTP'
          set ssl:verify-certificate yes
          set ftp:ssl-allow true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:max-retries 1
          set net:timeout 12
          mirror --reverse --parallel=4 --verbose=1 webapp/ ./
          bye
          LFTP

      - name: Verify deployed test domain responds
        shell: bash
        run: |
          set -euo pipefail
          URL="https://neu.koblenzer-puppenspiele.de/?deploy=${GITHUB_SHA}"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$URL" -o /tmp/test-site.html
          grep -q "Koblenzer Puppenspiele" /tmp/test-site.html
          echo "Manual test-domain deploy completed. Production was not modified."
