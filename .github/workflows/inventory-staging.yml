name: Inventory staging WordPress

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Install secure FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: List WordPress plugin and theme directories safely
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -c '
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            open --user "$FTP_USERNAME" --env-password -p 21 srv26.dsbsrv.de;
            echo "=== PLUGINS ===";
            cls -1 wp-content/plugins;
            echo "=== THEMES ===";
            cls -1 wp-content/themes;
            bye;
          '
