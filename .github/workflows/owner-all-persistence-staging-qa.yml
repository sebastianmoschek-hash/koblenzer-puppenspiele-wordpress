name: Owner all-controls persistence QA

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/**'
      - 'qa/owner-all-persistence-e2e.mjs'
      - '.github/workflows/owner-all-persistence-staging-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Bind the lock to the tested commit. A wedged Chromium process from an old
  # run must not prevent the current staging verification from starting.
  group: koblenzer-puppenspiele-owner-all-persistence-${{ github.sha }}
  cancel-in-progress: true

jobs:
  real-staging-owner-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
      LFTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
      STAGING_BASE: https://neu.koblenzer-puppenspiele.de
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install secure FTP client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Wait for normal staging deploy
        id: staging_deploy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          expected=$(sed -n 's/^ \* Version: //p' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/koblenzer-puppenspiele-core.php | head -1)
          test -n "$expected"
          for attempt in $(seq 1 48); do
            if curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
              "$STAGING_BASE/?kp_staging_bridge_health=1&kp_owner_wait=${GITHUB_RUN_ID}-${attempt}" -o /tmp/owner-all-deploy-health.json \
              && jq -e --arg version "$expected" '.success == true and .data.active == true and .data.version == $version' /tmp/owner-all-deploy-health.json >/dev/null 2>&1; then
              echo "PASS: normal staging deploy exposes plugin $expected"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: normal staging deploy did not expose plugin $expected" >&2
          cat /tmp/owner-all-deploy-health.json >&2 2>/dev/null || true
          exit 1

      - name: Verify staging plugin is current
        if: always() && steps.staging_deploy.outcome == 'success'
        id: staging_ready
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/owner-all-wait.log) 2>&1
          expected=$(sed -n 's/^ \* Version: //p' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/koblenzer-puppenspiele-core.php | head -1)
          test -n "$expected"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
              "$STAGING_BASE/?kp_staging_bridge_health=1&kp_owner_all=${GITHUB_RUN_ID}-${attempt}" -o /tmp/bridge-health.json \
              && jq -e --arg version "$expected" '.success == true and .data.active == true and .data.version == $version' /tmp/bridge-health.json >/dev/null 2>&1; then
              echo "PASS: staging runs plugin $expected"
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: staging did not reach plugin $expected" >&2
          [ -s /tmp/bridge-health.json ] && cat /tmp/bridge-health.json >&2 || true
          exit 1

      - name: Install Chromium after staging is ready
        if: always() && steps.staging_ready.outcome == 'success'
        id: browser_setup
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Create short-lived staging-only browser bridge
        if: always() && steps.staging_ready.outcome == 'success' && steps.browser_setup.outcome == 'success'
        id: e2e_setup
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/owner-all-setup.log) 2>&1
          : "${FTP_SERVER:?STAGING_FTP_SERVER secret is missing}"
          : "${FTP_USERNAME:?STAGING_FTP_USERNAME secret is missing}"
          : "${LFTP_PASSWORD:?STAGING_FTP_PASSWORD secret is missing}"
          token=$(openssl rand -hex 32)
          expires=$(( $(date +%s) + 600 ))
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          cat > /tmp/kp-e2e-owner-all.php <<PHP
          <?php
          if ( ! defined( 'ABSPATH' ) ) { exit; }
          define( 'KP_E2E_OWNER_TOKEN', '${token}' );
          define( 'KP_E2E_OWNER_EXPIRES', ${expires} );
          function kp_e2e_owner_allowed( \$raw ) {
              return time() <= KP_E2E_OWNER_EXPIRES
                  && 'neu.koblenzer-puppenspiele.de' === strtolower( (string) wp_parse_url( home_url(), PHP_URL_HOST ) )
                  && is_string( \$raw ) && hash_equals( KP_E2E_OWNER_TOKEN, \$raw );
          }
          function kp_e2e_owner_map() { return array(
              'studio'=>'kp_website_studio','sizes'=>'kp_responsive_sizes','navigation'=>'kp_owner_navigation_v1',
              'frontend_global'=>'kp_frontend_editor_global_v1','frontend_pages'=>'kp_frontend_editor_pages_v1',
              'free_global'=>'kp_touch_free_layout_global_v1','free_pages'=>'kp_touch_free_layout_pages_v1',
              'gesture_global'=>'kp_touch_gestures_global_v1','gesture_pages'=>'kp_touch_gestures_pages_v1',
              'image_global'=>'kp_image_position_global_v1','image_pages'=>'kp_image_position_pages_v1','history'=>'kp_owner_history_v1'
          ); }
          add_action( 'init', static function () {
              \$raw = isset( \$_GET['kp_e2e_login'] ) ? (string) wp_unslash( \$_GET['kp_e2e_login'] ) : '';
              if ( ! kp_e2e_owner_allowed( \$raw ) ) return;
              \$admins = get_users( array( 'role'=>'administrator', 'number'=>1, 'fields'=>'ID' ) );
              if ( ! \$admins ) wp_die( 'No staging administrator available.' );
              \$id=(int)\$admins[0]; wp_set_current_user(\$id); wp_set_auth_cookie(\$id,false,is_ssl());
              wp_safe_redirect( add_query_arg( array('kp_edit'=>'1','kp_e2e'=>'1'), home_url('/') ) ); exit;
          }, 1 );
          function kp_e2e_owner_guard() {
              \$raw=isset(\$_POST['token'])?(string)wp_unslash(\$_POST['token']):'';
              if(!current_user_can('manage_options')||!kp_e2e_owner_allowed(\$raw)) wp_send_json_error(array('message'=>'E2E denied.'),403);
          }
          add_action('wp_ajax_kp_e2e_owner_state',static function(){
              kp_e2e_owner_guard(); \$data=array(); \$exists=array();
              foreach(kp_e2e_owner_map() as \$key=>\$option){\$sentinel=new stdClass();\$value=get_option(\$option,\$sentinel);\$exists[\$key]=\$value!==\$sentinel;\$data[\$key]=\$value!==\$sentinel?\$value:array();}
              \$data['_exists']=\$exists; wp_send_json_success(\$data);
          });
          add_action('wp_ajax_kp_e2e_owner_restore',static function(){
              kp_e2e_owner_guard(); \$snapshot=isset(\$_POST['snapshot'])?json_decode(wp_unslash(\$_POST['snapshot']),true):null;
              if(!is_array(\$snapshot)) wp_send_json_error(array('message'=>'Invalid snapshot.'),400);
              \$exists=isset(\$snapshot['_exists'])&&is_array(\$snapshot['_exists'])?\$snapshot['_exists']:array();
              foreach(kp_e2e_owner_map() as \$key=>\$option){if(array_key_exists(\$key,\$exists)&&!\$exists[\$key]){delete_option(\$option);continue;}update_option(\$option,isset(\$snapshot[\$key])?\$snapshot[\$key]:array(),false);}
              if(function_exists('wp_cache_flush'))wp_cache_flush(); wp_send_json_success(array('message'=>'restored'));
          });
          PHP
          php -l /tmp/kp-e2e-owner-all.php
          lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; set net:max-retries 1; set net:timeout 15; open --user '$FTP_USERNAME' --env-password -p 21 '$FTP_SERVER'; mkdir -p /wp-content/mu-plugins; put /tmp/kp-e2e-owner-all.php -o /wp-content/mu-plugins/kp-e2e-owner-all.php; bye"
          echo 'PASS: short-lived bridge uploaded through staging-only account.'

      - name: Exercise every owner design control, undo and versions
        if: always() && steps.e2e_setup.outcome == 'success'
        id: persistence
        continue-on-error: true
        env:
          KP_E2E_BASE: https://neu.koblenzer-puppenspiele.de
          KP_E2E_TOKEN: ${{ steps.e2e_setup.outputs.token }}
        shell: bash
        run: |
          set -uo pipefail
          timeout --foreground --signal=TERM --kill-after=20s 10m \
            node qa/owner-all-persistence-e2e.mjs 2>&1 | tee /tmp/owner-all-persistence.log
          exit ${PIPESTATUS[0]}

      - name: Remove short-lived bridge
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${FTP_SERVER:-}" ] && [ -n "${FTP_USERNAME:-}" ] && [ -n "${LFTP_PASSWORD:-}" ]; then
            lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; set net:max-retries 1; set net:timeout 10; open --user '$FTP_USERNAME' --env-password -p 21 '$FTP_SERVER'; rm -f /wp-content/mu-plugins/kp-e2e-owner-all.php; bye"
          fi

      - name: Write auditable result
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.staging_deploy.outcome }}
          READY_OUTCOME: ${{ steps.staging_ready.outcome }}
          SETUP_OUTCOME: ${{ steps.e2e_setup.outcome }}
          PERSISTENCE_OUTCOME: ${{ steps.persistence.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-results
          {
            echo '# Owner controls + Versionen – echter Staging-Test'
            echo
            echo "Erzeugt: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Staging-only Direktdeploy: $DEPLOY_OUTCOME"
            echo "Staging-Deploy bereit: $READY_OUTCOME"
            echo "Staging-only E2E-Zugang: $SETUP_OUTCOME"
            echo "Persistenz-/Versionsprüfung: $PERSISTENCE_OUTCOME"
            echo
            echo '## Direktdeploy'
            echo '```text'
            if [ -s /tmp/owner-all-deploy.log ]; then tail -n 80 /tmp/owner-all-deploy.log; else echo 'Kein Direktdeploy-Log erzeugt.'; fi
            echo '```'
            echo
            echo '## Browser-/DB-Test'
            echo '```text'
            if [ -s /tmp/owner-all-persistence.log ]; then cat /tmp/owner-all-persistence.log; else echo 'Kein Testlog erzeugt.'; fi
            echo '```'
          } > /tmp/owner-all-persistence-latest.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p qa-results
          cp /tmp/owner-all-persistence-latest.md qa-results/owner-all-persistence-latest.md
          git add qa-results/owner-all-persistence-latest.md
          if ! git diff --cached --quiet; then git commit -m 'qa: update all-control persistence status [skip ci]'; git push origin HEAD:main; fi

      - name: Final all-control persistence gate
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.staging_deploy.outcome }}
          READY_OUTCOME: ${{ steps.staging_ready.outcome }}
          SETUP_OUTCOME: ${{ steps.e2e_setup.outcome }}
          PERSISTENCE_OUTCOME: ${{ steps.persistence.outcome }}
        shell: bash
        run: |
          test "$DEPLOY_OUTCOME" = 'success'
          test "$READY_OUTCOME" = 'success'
          test "$SETUP_OUTCOME" = 'success'
          test "$PERSISTENCE_OUTCOME" = 'success'
