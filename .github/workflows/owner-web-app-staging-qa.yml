name: Owner web app staging QA

on:
  workflow_run:
    workflows: ['Deploy staging WordPress']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-web-app-staging-qa.yml'
      - 'qa/touch-runtime-browser-test.mjs'
      - 'qa/touch-staging-persistence-e2e.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: koblenzer-puppenspiele-owner-web-app-qa
  cancel-in-progress: true

jobs:
  staging-owner-web-app:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FTP_SERVER: srv26.dsbsrv.de
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify public PWA and owner assets on staging
        id: asset_verify
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          BASE='https://neu.koblenzer-puppenspiele.de'
          PLUGIN='/wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets'
          LOG=/tmp/owner-web-app-check.log
          : > "$LOG"
          failures=0

          check() {
            local label="$1"
            shift
            if "$@" >>"$LOG" 2>&1; then
              echo "OK: $label" | tee -a "$LOG"
            else
              echo "FEHLER: $label" | tee -a "$LOG"
              failures=$((failures + 1))
            fi
          }

          fetch_asset() {
            local rel="$1"
            local out="$2"
            local sep='?'
            [[ "$rel" == *'?'* ]] && sep='&'
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 3 -H 'Cache-Control: no-cache' "$BASE$rel${sep}kp_qa=${GITHUB_SHA}-${GITHUB_RUN_ID}" -o "$out"
          }

          check 'Staging-Startseite abrufbar' fetch_asset '/' /tmp/home.html
          check 'PWA-Manifest abrufbar' fetch_asset '/?kp_webapp_manifest=1' /tmp/manifest.json
          check 'Service Worker abrufbar' fetch_asset '/?kp_webapp_sw=1' /tmp/sw.js
          check 'Owner Web App JS abrufbar' fetch_asset "$PLUGIN/owner-web-app.js" /tmp/owner-web-app.js
          check 'Responsive Web JS abrufbar' fetch_asset "$PLUGIN/owner-responsive-web.js" /tmp/owner-responsive-web.js
          check 'Owner Web App CSS abrufbar' fetch_asset "$PLUGIN/owner-web-app.css" /tmp/owner-web-app.css
          check 'Responsive Web CSS abrufbar' fetch_asset "$PLUGIN/owner-responsive-web.css" /tmp/owner-responsive-web.css
          check 'App-Icon abrufbar' fetch_asset "$PLUGIN/kp-app-icon.svg" /tmp/kp-app-icon.svg
          check 'Touch-Gesten abrufbar' fetch_asset "$PLUGIN/touch-gestures.js" /tmp/touch-gestures.js
          check 'Free-Layout abrufbar' fetch_asset "$PLUGIN/touch-free-layout.js" /tmp/touch-free-layout.js
          check 'Editor-Bridge abrufbar' fetch_asset "$PLUGIN/touch-editor-bridge.js" /tmp/touch-editor-bridge.js
          check 'Touch-Persistenz abrufbar' fetch_asset "$PLUGIN/touch-persistence.js" /tmp/touch-persistence.js
          check 'Menü-X-Regler abrufbar' fetch_asset "$PLUGIN/owner-menu-x.js" /tmp/owner-menu-x.js

          if [ -s /tmp/home.html ]; then
            if grep -qiE 'kritischen Fehler|critical error|fatal error|parse error' /tmp/home.html; then
              echo 'FEHLER: WordPress-/PHP-Fehlertext auf der Startseite' | tee -a "$LOG"
              failures=$((failures + 1))
            else
              echo 'OK: kein WordPress-/PHP-Fehlertext' | tee -a "$LOG"
            fi
            check 'Manifest im HTML eingebunden' grep -Fq 'kp_webapp_manifest=1' /tmp/home.html
            check 'Owner Web App im HTML eingebunden' grep -Fq 'owner-web-app.js' /tmp/home.html
            echo 'INFO: Responsive Web ist absichtlich nur im eingeloggten Owner-Modus eingebunden.' | tee -a "$LOG"
            check 'Instagram-Profil kanonisch auf Staging verlinkt' grep -Fq 'https://www.instagram.com/koblenzer_puppenspiele/' /tmp/home.html
          fi

          [ -s /tmp/manifest.json ] && check 'Manifest-Name korrekt' jq -e '.name == "Koblenzer Puppenspiele"' /tmp/manifest.json
          [ -s /tmp/manifest.json ] && check 'Manifest-Kurzname korrekt' jq -e '.short_name == "Puppenspiele"' /tmp/manifest.json
          [ -s /tmp/manifest.json ] && check 'Manifest standalone' jq -e '.display == "standalone"' /tmp/manifest.json
          [ -s /tmp/manifest.json ] && check 'Manifest enthält Icon' jq -e '.icons | length >= 1' /tmp/manifest.json
          [ -s /tmp/sw.js ] && check 'Service Worker Event-Listener vorhanden' grep -Fq 'self.addEventListener' /tmp/sw.js
          [ -s /tmp/sw.js ] && check 'Service Worker fetch vorhanden' grep -Fq "'fetch'" /tmp/sw.js
          [ -s /tmp/sw.js ] && check 'Service Worker Cache vorhanden' grep -Fq 'KP_CACHE' /tmp/sw.js
          [ -s /tmp/kp-app-icon.svg ] && check 'SVG-App-Icon gültig' grep -Fq '<svg' /tmp/kp-app-icon.svg

          for js in owner-web-app owner-responsive-web touch-gestures touch-free-layout touch-editor-bridge touch-persistence owner-menu-x; do
            [ -s "/tmp/$js.js" ] && check "$js JavaScript-Syntax" node --check "/tmp/$js.js"
          done
          [ -s /tmp/owner-web-app.css ] && check 'Owner-Web-App Styles nicht leer' test -s /tmp/owner-web-app.css
          [ -s /tmp/owner-responsive-web.css ] && check 'Responsive-Web Styles nicht leer' test -s /tmp/owner-responsive-web.css

          if [ -s /tmp/touch-gestures.js ]; then
            check 'Touch-Gesten haben expliziten flush' grep -Fq 'async function flush()' /tmp/touch-gestures.js
            check 'Touch-Gesten lassen Editor-Toolbar nach Drag durch' grep -Fq '!target?.closest(uiSelector)' /tmp/touch-gestures.js
            if grep -Fq 'postSave();' /tmp/touch-gestures.js; then echo 'FEHLER: Touch-Gesten enthalten alten Auto-Save-Aufruf postSave();' | tee -a "$LOG"; failures=$((failures+1)); else echo 'OK: Touch-Gesten ohne alten postSave()-Auto-Save' | tee -a "$LOG"; fi
          fi
          if [ -s /tmp/touch-free-layout.js ]; then
            check 'Free-Layout hat expliziten flush' grep -Fq 'async function flush()' /tmp/touch-free-layout.js
            check 'Free-Layout lässt Editor-Toolbar nach Drag durch' grep -Fq '!target?.closest(uiSelector)' /tmp/touch-free-layout.js
            if grep -Fq 'postSave();' /tmp/touch-free-layout.js; then echo 'FEHLER: Free-Layout enthält alten Auto-Save-Aufruf postSave();' | tee -a "$LOG"; failures=$((failures+1)); else echo 'OK: Free-Layout ohne alten postSave()-Auto-Save' | tee -a "$LOG"; fi
          fi
          [ -s /tmp/touch-editor-bridge.js ] && check 'Editor-Bridge bündelt Touch-Entwürfe' grep -Fq 'flushTouchDrafts' /tmp/touch-editor-bridge.js
          [ -s /tmp/touch-editor-bridge.js ] && check 'Orange Speichern-Taste ist Persistenzpfad' grep -Fq "target.closest('.kp-fe2-save')" /tmp/touch-editor-bridge.js
          [ -s /tmp/touch-persistence.js ] && check 'Live-Persistenz schützt lokale Entwürfe' grep -Fq 'editorHasLocalTouchState' /tmp/touch-persistence.js
          [ -s /tmp/touch-persistence.js ] && check 'Live-Persistenz hydriert Runtime' grep -Fq 'runtime?.hydrate' /tmp/touch-persistence.js
          [ -s /tmp/owner-menu-x.js ] && check 'Menü-X-Regler vorhanden' grep -Fq 'Horizontale Position' /tmp/owner-menu-x.js
          [ -s /tmp/owner-menu-x.js ] && check 'Menü-X-Regler benennt Links/Rechts' grep -Fq 'Links ↔ rechts verschieben' /tmp/owner-menu-x.js

          echo "FAILURES=$failures" | tee -a "$LOG"
          test "$failures" -eq 0

      - name: Install browser and secure FTP client for interaction QA
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Exercise touch behavior in isolated Chromium harness
        if: always()
        id: behavior_verify
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          : > /tmp/touch-browser-check.log
          if node qa/touch-runtime-browser-test.mjs > /tmp/touch-browser-check.log 2>&1; then
            cat /tmp/touch-browser-check.log
            exit 0
          else
            cat /tmp/touch-browser-check.log
            exit 1
          fi

      - name: Install temporary staging-only E2E auth bridge
        if: always()
        id: e2e_setup
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FTP_USERNAME:?FTP_USERNAME secret is missing}"
          : "${LFTP_PASSWORD:?FTP_PASSWORD secret is missing}"
          token=$(openssl rand -hex 32)
          expires=$(( $(date +%s) + 1200 ))
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/kp-e2e
          cat > /tmp/kp-e2e/kp-e2e-touch.php <<PHP
          <?php
          /* Temporary staging-only QA bridge. Generated during CI, never committed/deployed to production. */
          if ( ! defined( 'ABSPATH' ) ) { exit; }
          define( 'KP_E2E_TOUCH_TOKEN', '${token}' );
          define( 'KP_E2E_TOUCH_EXPIRES', ${expires} );
          function kp_e2e_touch_allowed_token( \$raw ) {
              if ( time() > KP_E2E_TOUCH_EXPIRES ) { return false; }
              if ( 'neu.koblenzer-puppenspiele.de' !== strtolower( (string) wp_parse_url( home_url(), PHP_URL_HOST ) ) ) { return false; }
              return is_string( \$raw ) && hash_equals( KP_E2E_TOUCH_TOKEN, \$raw );
          }
          add_action( 'init', static function () {
              \$raw = isset( \$_GET['kp_e2e_login'] ) ? (string) wp_unslash( \$_GET['kp_e2e_login'] ) : '';
              if ( ! kp_e2e_touch_allowed_token( \$raw ) ) { return; }
              \$admins = get_users( array( 'role' => 'administrator', 'number' => 1, 'fields' => 'ID' ) );
              if ( ! \$admins ) { wp_die( 'No administrator available for staging E2E.' ); }
              \$id = (int) \$admins[0];
              wp_set_current_user( \$id );
              wp_set_auth_cookie( \$id, false, is_ssl() );
              wp_safe_redirect( add_query_arg( array( 'kp_edit' => '1', 'kp_e2e' => '1' ), home_url( '/' ) ) );
              exit;
          }, 1 );
          function kp_e2e_touch_guard() {
              \$raw = isset( \$_POST['token'] ) ? (string) wp_unslash( \$_POST['token'] ) : '';
              if ( ! current_user_can( 'manage_options' ) || ! kp_e2e_touch_allowed_token( \$raw ) ) {
                  wp_send_json_error( array( 'message' => 'E2E denied.' ), 403 );
              }
          }
          add_action( 'wp_ajax_kp_e2e_touch_state', static function () {
              kp_e2e_touch_guard();
              wp_send_json_success( array(
                  'free_global' => get_option( 'kp_touch_free_layout_global_v1', array() ),
                  'free_pages' => get_option( 'kp_touch_free_layout_pages_v1', array() ),
                  'gesture_global' => get_option( 'kp_touch_gestures_global_v1', array() ),
                  'gesture_pages' => get_option( 'kp_touch_gestures_pages_v1', array() ),
              ) );
          } );
          add_action( 'wp_ajax_kp_e2e_touch_restore', static function () {
              kp_e2e_touch_guard();
              \$snapshot = isset( \$_POST['snapshot'] ) ? json_decode( wp_unslash( \$_POST['snapshot'] ), true ) : null;
              if ( ! is_array( \$snapshot ) ) { wp_send_json_error( array( 'message' => 'Invalid snapshot.' ), 400 ); }
              foreach ( array(
                  'free_global' => 'kp_touch_free_layout_global_v1',
                  'free_pages' => 'kp_touch_free_layout_pages_v1',
                  'gesture_global' => 'kp_touch_gestures_global_v1',
                  'gesture_pages' => 'kp_touch_gestures_pages_v1',
              ) as \$key => \$option ) {
                  update_option( \$option, isset( \$snapshot[\$key] ) && is_array( \$snapshot[\$key] ) ? \$snapshot[\$key] : array(), false );
              }
              wp_send_json_success( array( 'message' => 'restored' ) );
          } );
          PHP

          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 20;
            open --user '$FTP_USERNAME' --env-password -p 21 '$FTP_SERVER';
            mkdir -p /wp-content/mu-plugins;
            put /tmp/kp-e2e/kp-e2e-touch.php -o /wp-content/mu-plugins/kp-e2e-touch.php;
            bye
          "

      - name: Exercise REAL staging save and reload persistence
        if: always() && steps.e2e_setup.outcome == 'success'
        id: persistence_verify
        continue-on-error: true
        env:
          KP_E2E_BASE: https://neu.koblenzer-puppenspiele.de
          KP_E2E_TOKEN: ${{ steps.e2e_setup.outputs.token }}
        shell: bash
        run: |
          set -uo pipefail
          : > /tmp/touch-staging-persistence.log
          if node qa/touch-staging-persistence-e2e.mjs > /tmp/touch-staging-persistence.log 2>&1; then
            cat /tmp/touch-staging-persistence.log
            exit 0
          else
            cat /tmp/touch-staging-persistence.log
            exit 1
          fi

      - name: Remove temporary staging E2E auth bridge
        if: always()
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set +e
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 1;
            set net:timeout 15;
            open --user '$FTP_USERNAME' --env-password -p 21 '$FTP_SERVER';
            rm -f /wp-content/mu-plugins/kp-e2e-touch.php;
            bye
          "
          exit 0

      - name: Persist owner web app QA result
        if: always()
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.asset_verify.outcome }}
          BEHAVIOR_OUTCOME: ${{ steps.behavior_verify.outcome }}
          PERSISTENCE_OUTCOME: ${{ steps.persistence_verify.outcome }}
        run: |
          set -euo pipefail
          generated=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          {
            echo '# Owner Web App – letzter Staging-Test'
            echo
            echo "Erzeugt: $generated"
            echo
            echo "Asset-/Deployment-Prüfung: $VERIFY_OUTCOME"
            echo "Isolierter Browser-Verhaltenstest: $BEHAVIOR_OUTCOME"
            echo "Echter Staging-Speicher-/Reload-Test: $PERSISTENCE_OUTCOME"
            echo
            echo '## Ausgelieferte Staging-Dateien'
            echo '```text'
            if [ -f /tmp/owner-web-app-check.log ]; then cat /tmp/owner-web-app-check.log; else echo 'Kein Asset-Prüflog erzeugt.'; fi
            echo '```'
            echo
            echo '## Touch-Verhalten im isolierten Chromium'
            echo '```text'
            if [ -f /tmp/touch-browser-check.log ]; then cat /tmp/touch-browser-check.log; else echo 'Kein Browser-Prüflog erzeugt.'; fi
            echo '```'
            echo
            echo '## Echter Staging-Persistenztest'
            echo '```text'
            if [ -f /tmp/touch-staging-persistence.log ]; then cat /tmp/touch-staging-persistence.log; else echo 'Kein echter Staging-Persistenzlog erzeugt.'; fi
            echo '```'
          } > /tmp/owner-web-app-latest.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p qa-results
          cp /tmp/owner-web-app-latest.md qa-results/owner-web-app-latest.md
          git add qa-results/owner-web-app-latest.md
          if git diff --cached --quiet; then
            echo 'Owner web app QA report unchanged.'
          else
            git commit -m 'qa: update owner web app staging status [skip ci]'
            git push origin HEAD:main
          fi

      - name: Final owner web app quality gate
        if: always()
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.asset_verify.outcome }}
          BEHAVIOR_OUTCOME: ${{ steps.behavior_verify.outcome }}
          PERSISTENCE_OUTCOME: ${{ steps.persistence_verify.outcome }}
        run: |
          set -euo pipefail
          test "$VERIFY_OUTCOME" = 'success'
          test "$BEHAVIOR_OUTCOME" = 'success'
          test "$PERSISTENCE_OUTCOME" = 'success'
