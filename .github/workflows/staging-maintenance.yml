name: Staging maintenance lane

on:
  push:
    branches: [main]
    paths:
      - 'qa/staging-maintenance-request.json'
      - '.github/workflows/staging-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: koblenzer-puppenspiele-staging-maintenance
  cancel-in-progress: true

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
      STAGING_BASE: https://neu.koblenzer-puppenspiele.de
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read and validate maintenance request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          file='qa/staging-maintenance-request.json'
          test -s "$file"
          jq -e 'type == "object"' "$file" >/dev/null
          request_id=$(jq -r '.request_id // "manual"' "$file")
          operation=$(jq -r '.operation // "diagnose"' "$file")
          case "$operation" in
            diagnose|cache_flush|sync_front_page_template) ;;
            studio_patch)
              jq -e '.payload.patch | type == "object" and length >= 1 and length <= 24' "$file" >/dev/null
              ;;
            *) echo "Unsupported operation: $operation" >&2; exit 1 ;;
          esac
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"

      - name: Install secure FTP client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Wait for locked staging bridge
        shell: bash
        run: |
          set -euo pipefail
          expected=$(sed -n 's/^ \* Version: //p' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/koblenzer-puppenspiele-core.php | head -1)
          test -n "$expected"
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              "$STAGING_BASE/?kp_staging_bridge_health=1&kp_qa=${GITHUB_RUN_ID}-${attempt}" \
              -o /tmp/bridge-health.json; then
              if jq -e --arg version "$expected" '.success == true and .data.active == true and .data.host == "neu.koblenzer-puppenspiele.de" and .data.version == $version and .data.mode == "one-time-file"' /tmp/bridge-health.json >/dev/null 2>&1; then
                jq . /tmp/bridge-health.json
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Locked staging bridge did not become ready for plugin $expected" >&2
          [ -s /tmp/bridge-health.json ] && cat /tmp/bridge-health.json >&2 || true
          exit 1

      - name: Upload one-time maintenance request
        id: bridge_request
        env:
          FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FTP_USERNAME:?STAGING_FTP_USERNAME secret is missing}"
          : "${LFTP_PASSWORD:?STAGING_FTP_PASSWORD secret is missing}"
          token=$(openssl rand -hex 32)
          expires=$(( $(date +%s) + 240 ))
          created=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

          jq \
            --arg token "$token" \
            --arg created_at "$created" \
            --argjson expires_at "$expires" \
            '. + {token:$token, created_at:$created_at, expires_at:$expires_at}' \
            qa/staging-maintenance-request.json > /tmp/kp-maint-request.json

          cat > /tmp/kp-maint-htaccess <<'EOF'
          Require all denied
          <IfModule mod_access_compat.c>
            Order allow,deny
            Deny from all
          </IfModule>
          EOF

          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 20;
            open --user '$FTP_USERNAME' --env-password -p 21 '$FTP_SERVER';
            mkdir -p /wp-content/.kp-staging-maintenance-requests;
            put /tmp/kp-maint-htaccess -o /wp-content/.kp-staging-maintenance-requests/.htaccess;
            put /tmp/kp-maint-request.json -o /wp-content/.kp-staging-maintenance-requests/${token}.json;
            bye
          "

      - name: Run locked staging maintenance request
        id: run
        env:
          TOKEN: ${{ steps.bridge_request.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H 'Cache-Control: no-cache' \
            --data-urlencode "kp_staging_maint=$TOKEN" \
            "$STAGING_BASE/" \
            -o /tmp/staging-maintenance.json
          jq . /tmp/staging-maintenance.json
          jq -e '.success == true and .data.diagnostics.host == "neu.koblenzer-puppenspiele.de"' /tmp/staging-maintenance.json >/dev/null

      - name: Confirm one-time request is gone
        if: always()
        env:
          TOKEN: ${{ steps.bridge_request.outputs.token }}
          FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        shell: bash
        run: |
          set +e
          if [ -n "${TOKEN:-}" ] && [ -n "${FTP_USERNAME:-}" ] && [ -n "${LFTP_PASSWORD:-}" ]; then
            lftp -c "
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate true;
              set net:max-retries 1;
              set net:timeout 15;
              open --user '$FTP_USERNAME' --env-password -p 21 '$FTP_SERVER';
              rm -f /wp-content/.kp-staging-maintenance-requests/${TOKEN}.json;
              rm -f /wp-content/.kp-staging-maintenance-requests/${TOKEN}.running;
              bye
            "
          fi

      - name: Write maintenance report
        if: always()
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          OPERATION: ${{ steps.request.outputs.operation }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-results
          {
            echo '# Staging maintenance – latest'
            echo
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ')"
            echo "Request: $REQUEST_ID"
            echo "Operation: $OPERATION"
            echo "Outcome: $RUN_OUTCOME"
            echo 'Bridge: permanent + staging-only + one-time request file'
            echo
            echo '```json'
            if [ -s /tmp/staging-maintenance.json ]; then jq . /tmp/staging-maintenance.json; else echo '{"success":false,"message":"No response captured"}'; fi
            echo '```'
          } > qa-results/staging-maintenance-latest.md

      - name: Commit maintenance report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add qa-results/staging-maintenance-latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa: update staging maintenance report [skip ci]'
          git push origin HEAD:main
