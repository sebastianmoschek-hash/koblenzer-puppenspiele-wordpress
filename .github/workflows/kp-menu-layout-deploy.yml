name: KP staging menu layout
on:
  push:
    branches: [codex/kp-editor-ai-staging]
    paths:
      - deployments/kp-menu-layout/**
      - .github/workflows/kp-menu-layout-deploy.yml
permissions:
  contents: read
concurrency:
  group: kp-staging-file-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LFTP_PASSWORD: ${{ secrets.KP_TEST_FTP_PASSWORD }}
      FTP_USERNAME: ${{ secrets.KP_TEST_FTP_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate branch, account and JavaScript
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/kp-editor-ai-staging
          test "$FTP_USERNAME" = web16_ftpneu
          test -n "$LFTP_PASSWORD"
          node --check deployments/kp-menu-layout/kp-inline.js
          node --check deployments/kp-menu-layout/kp-menu-layout.js
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends lftp
      - name: Back up staging and verify exact starting files
        run: |
          set -euo pipefail
          mkdir -p backup
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 20;
            open --user web16_ftpneu --env-password -p 21 srv26.dsbsrv.de;
            get modern.html -o backup/modern.html;
            get kp-inline.js -o backup/kp-inline.js;
            get kp-inline.css -o backup/kp-inline.css;
            get kp-menu-layout.js -o backup/kp-menu-layout.js;
            bye
          "
          cd backup
          printf '%s\n' \
            '1519d5a77c323b2759cf313b81976bde59329e55655d604ef06451985837cb50  modern.html' \
            '6b2370dae4c10b3bdb3df336f552ac3bdb97a8cc83426e5e5284a4e72499d4c1  kp-inline.js' \
            'af10c8d32c8e73775a608926ae9a575ff35d55cb69d0c0fd080d0fc7585bcad5  kp-inline.css' \
            '06d110403af2eb288cab951624415fb00d1bf668582dd20c4fd053fbc78ce417  kp-menu-layout.js' | sha256sum -c -
      - name: Preserve verified backup
        uses: actions/upload-artifact@v4
        with:
          name: kp-menu-layout-before-${{ github.run_id }}
          path: backup/
          retention-days: 30
          if-no-files-found: error
      - name: Upload only menu assets to the test site
        id: upload
        if: contains(github.event.head_commit.message, '[kp-menu-layout-upload]')
        run: |
          set -euo pipefail
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 20;
            open --user web16_ftpneu --env-password -p 21 srv26.dsbsrv.de;
            put deployments/kp-menu-layout/kp-inline.css -o kp-inline.css;
            put deployments/kp-menu-layout/kp-inline.js -o kp-inline.js;
            put deployments/kp-menu-layout/kp-menu-layout.js -o kp-menu-layout.js;
            put deployments/kp-menu-layout/modern.html -o modern.html;
            get kp-inline.css -o /tmp/kp-inline.css;
            get kp-inline.js -o /tmp/kp-inline.js;
            get kp-menu-layout.js -o /tmp/kp-menu-layout.js;
            get modern.html -o /tmp/modern.html;
            bye
          "
          for file in kp-inline.css kp-inline.js kp-menu-layout.js modern.html; do
            cmp "deployments/kp-menu-layout/$file" "/tmp/$file"
          done
      - name: Restore old files if upload fails
        if: failure() && steps.upload.outcome == 'failure'
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            open --user web16_ftpneu --env-password -p 21 srv26.dsbsrv.de;
            put backup/kp-inline.css -o kp-inline.css;
            put backup/kp-inline.js -o kp-inline.js;
            put backup/kp-menu-layout.js -o kp-menu-layout.js;
            put backup/modern.html -o modern.html;
            bye
          "
