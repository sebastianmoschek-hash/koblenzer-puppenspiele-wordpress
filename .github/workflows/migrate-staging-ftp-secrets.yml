name: Migrate staging workflows to sandboxed FTP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-staging-ftp-secrets.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Switch staging workflows to restricted secrets
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/workflows/deploy-staging.yml
            .github/workflows/owner-all-persistence-staging-qa.yml
            .github/workflows/owner-web-app-staging-qa.yml
            .github/workflows/staging-maintenance.yml
            .github/workflows/sync-staging-source.yml
            .github/workflows/inventory-staging.yml
          )

          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            sed -i 's/secrets\.FTP_USERNAME/secrets.STAGING_FTP_USERNAME/g' "$file"
            sed -i 's/secrets\.FTP_PASSWORD/secrets.STAGING_FTP_PASSWORD/g' "$file"
            sed -i 's#FTP_SERVER: srv26\.dsbsrv\.de#FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}#g' "$file"
          done

          # sync-staging-source has the host inline rather than in an env block.
          if [ -f .github/workflows/sync-staging-source.yml ]; then
            sed -i "s/open --user '\$FTP_USERNAME' --env-password -p 21 srv26\.dsbsrv\.de;/open --user '\$FTP_USERNAME' --env-password -p 21 '\$FTP_SERVER';/g" .github/workflows/sync-staging-source.yml
            if ! grep -q '^    env:$' .github/workflows/sync-staging-source.yml; then
              sed -i '/    runs-on: ubuntu-latest/a\    env:\n      FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}' .github/workflows/sync-staging-source.yml
            fi
          fi

          # This one-shot migration workflow is not needed afterwards.
          rm -f .github/workflows/migrate-staging-ftp-secrets.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'chore: use staging-only FTP credentials' || exit 0
          git push origin HEAD:main
