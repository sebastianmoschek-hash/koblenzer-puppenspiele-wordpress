name: Refine owner staging QA checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-owner-staging-qa.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Correct owner-only asset assertion and add Instagram check
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/owner-web-app-staging-qa.yml')
          s = p.read_text()
          old = "          check 'Responsive Web im HTML eingebunden' grep -Fq 'owner-responsive-web.js' /tmp/home.html\n"
          new = "          echo 'INFO: Responsive Web ist absichtlich nur im eingeloggten Owner-Modus eingebunden.' | tee -a \"$LOG\"\n          check 'Instagram-Profil kanonisch auf Staging verlinkt' grep -Fq 'https://www.instagram.com/koblenzer_puppenspiele/' /tmp/home.html\n          check 'Staging Touch-Gesten enthalten Toolbar-Hotfix' grep -Fq '!target?.closest(uiSelector)' /tmp/touch-gestures.js\n          check 'Staging Free-Layout enthält Toolbar-Hotfix' grep -Fq '!target?.closest(uiSelector)' /tmp/touch-free-layout.js\n"
          if new in s:
              print('QA checks already refined')
          elif old in s:
              p.write_text(s.replace(old, new, 1))
              print('QA checks refined')
          else:
              raise SystemExit('Expected owner-responsive public assertion not found')
      - name: Commit QA refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/owner-web-app-staging-qa.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'qa: verify Instagram and deployed touch toolbar hotfix'
          git pull --rebase origin main
          git push origin HEAD:main
