name: Refine owner staging QA checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-owner-staging-qa.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Correct owner-only assertion, add Instagram/hotfix checks and bypass caches
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/owner-web-app-staging-qa.yml')
          s = p.read_text()

          old_check = "          check 'Responsive Web im HTML eingebunden' grep -Fq 'owner-responsive-web.js' /tmp/home.html\n"
          new_check = "          echo 'INFO: Responsive Web ist absichtlich nur im eingeloggten Owner-Modus eingebunden.' | tee -a \"$LOG\"\n          check 'Instagram-Profil kanonisch auf Staging verlinkt' grep -Fq 'https://www.instagram.com/koblenzer_puppenspiele/' /tmp/home.html\n          check 'Staging Touch-Gesten enthalten Toolbar-Hotfix' grep -Fq '!target?.closest(uiSelector)' /tmp/touch-gestures.js\n          check 'Staging Free-Layout enthält Toolbar-Hotfix' grep -Fq '!target?.closest(uiSelector)' /tmp/touch-free-layout.js\n"
          if new_check not in s:
              if old_check not in s:
                  raise SystemExit('Expected owner-responsive public assertion not found')
              s = s.replace(old_check, new_check, 1)

          old_fetch = '            curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 3 "$BASE$rel" -o "$out"\n'
          new_fetch = '            local sep="?"; [[ "$rel" == *"?"* ]] && sep="&"\n            curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 3 -H "Cache-Control: no-cache" "$BASE$rel${sep}kp_qa=${GITHUB_SHA}-${GITHUB_RUN_ID}" -o "$out"\n'
          if new_fetch not in s:
              if old_fetch not in s:
                  raise SystemExit('Expected staging fetch command not found')
              s = s.replace(old_fetch, new_fetch, 1)

          p.write_text(s)
          print('Owner staging QA refined and cache-busted')
      - name: Commit QA refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/owner-web-app-staging-qa.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'qa: verify current staging touch bytes and Instagram link'
          git pull --rebase origin main
          git push origin HEAD:main
