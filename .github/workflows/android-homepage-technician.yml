name: Android Homepage Technician

on:
  push:
    branches:
      - 'feature/android-*'
    paths:
      - 'android/homepage-technician/**'
      - 'wp-content/mu-plugins/kp-mobile-live-bridge.php'
      - 'qa/mobile-live-contract.sh'
      - '.github/workflows/android-homepage-technician.yml'
  pull_request:
    paths:
      - 'android/homepage-technician/**'
      - 'wp-content/mu-plugins/kp-mobile-live-bridge.php'
      - 'qa/mobile-live-contract.sh'
      - '.github/workflows/android-homepage-technician.yml'

permissions:
  contents: read

jobs:
  android-contract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Mobile live security contract
        run: bash qa/mobile-live-contract.sh
      - name: Compile debug APK without production secrets
        working-directory: android/homepage-technician
        run: gradle --no-daemon :app:assembleDebug
