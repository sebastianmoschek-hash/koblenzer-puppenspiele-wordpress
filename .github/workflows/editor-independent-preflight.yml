name: Editor independent preflight

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/**'
      - 'qa/**'
      - '.circleci/**'
      - '.github/workflows/editor-independent-preflight.yml'
  pull_request:
    branches: [main]
    paths:
      - 'wp-content/**'
      - 'qa/**'
      - '.circleci/**'
      - '.github/workflows/editor-independent-preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editor-independent-preflight-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Editor contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Runtime versions
        run: |
          set -euo pipefail
          node --version
          php --version
          bash --version | head -1

      - name: Word / Canva history contract
        id: word
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash qa/word-history-contract.sh 2>&1 | tee /tmp/word-history.log
          exit ${PIPESTATUS[0]}

      - name: Unified Save / Undo / AI contract
        id: unified
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash qa/unified-editor-contract.sh 2>&1 | tee /tmp/unified-editor.log
          exit ${PIPESTATUS[0]}

      - name: Create Undo / Redo contract
        id: create
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash qa/create-undo-contract.sh 2>&1 | tee /tmp/create-undo.log
          exit ${PIPESTATUS[0]}

      - name: Calendar Undo / Redo contract
        id: calendar
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash qa/calendar-undo-contract.sh 2>&1 | tee /tmp/calendar-undo.log
          exit ${PIPESTATUS[0]}

      - name: PHP syntax for editor MU plugins
        id: php_syntax
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/php-syntax.log) 2>&1
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null || { echo "PHP syntax failed: $file"; exit 1; }
          done < <(find wp-content/mu-plugins -maxdepth 1 -type f -name 'kp-*.php' -print0)
          echo 'PASS: editor MU-plugin PHP syntax.'

      - name: JavaScript syntax for editor runtimes
        id: js_syntax
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/js-syntax.log) 2>&1
          files=(
            wp-content/mu-plugins/kp-canva-editor.js
            wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-editor-v2.js
            wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/image-position.js
            wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-card-controls.js
            wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/owner-web-app-extensions.js
            wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/design-presets.js
          )
          for file in "${files[@]}"; do node --check "$file"; done
          echo 'PASS: editor JavaScript syntax.'

      - name: No browser leave-confirmation regression
        id: unload
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/no-unload.log) 2>&1
          if grep -R --include='*.js' --include='*.php' -nE "event\.returnValue\s*=|returnValue\s*=\s*['\"]" wp-content/mu-plugins wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets; then
            echo 'FAIL: browser leave-confirmation code found.' >&2
            exit 1
          fi
          echo 'PASS: no leave-confirmation regression.'

      - name: Persist independent report
        if: always() && github.event_name == 'push'
        env:
          WORD: ${{ steps.word.outcome }}
          UNIFIED: ${{ steps.unified.outcome }}
          CREATE: ${{ steps.create.outcome }}
          CALENDAR: ${{ steps.calendar.outcome }}
          PHP_SYNTAX: ${{ steps.php_syntax.outcome }}
          JS_SYNTAX: ${{ steps.js_syntax.outcome }}
          UNLOAD: ${{ steps.unload.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/github-editor-preflight-latest.md
          {
            echo '# Independent editor preflight'
            echo
            echo "Commit tested: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Word / Canva history | $WORD |"
            echo "| Unified Save / Undo / AI | $UNIFIED |"
            echo "| Create Undo / Redo | $CREATE |"
            echo "| Calendar Undo / Redo | $CALENDAR |"
            echo "| PHP syntax | $PHP_SYNTAX |"
            echo "| JavaScript syntax | $JS_SYNTAX |"
            echo "| No leave-confirmation | $UNLOAD |"
          } > "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --quiet
          git checkout -B main origin/main --quiet
          mkdir -p qa-results
          cp "$report" qa-results/github-editor-preflight-latest.md
          git add qa-results/github-editor-preflight-latest.md
          if ! git diff --cached --quiet; then
            git commit -m 'qa: update independent editor preflight [skip ci]' --quiet
            git push origin HEAD:main --quiet
          fi

      - name: Final independent gate
        if: always()
        env:
          WORD: ${{ steps.word.outcome }}
          UNIFIED: ${{ steps.unified.outcome }}
          CREATE: ${{ steps.create.outcome }}
          CALENDAR: ${{ steps.calendar.outcome }}
          PHP_SYNTAX: ${{ steps.php_syntax.outcome }}
          JS_SYNTAX: ${{ steps.js_syntax.outcome }}
          UNLOAD: ${{ steps.unload.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$WORD" "$UNIFIED" "$CREATE" "$CALENDAR" "$PHP_SYNTAX" "$JS_SYNTAX" "$UNLOAD"; do
            [[ "$value" == 'success' ]] || exit 1
          done
          echo 'PASS: independent editor preflight is green.'
