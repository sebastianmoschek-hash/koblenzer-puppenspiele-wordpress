name: Owner fast staging deploy

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/**'
      - '.github/workflows/owner-fast-staging.yml'
  workflow_dispatch:

concurrency:
  group: koblenzer-puppenspiele-owner-fast-staging
  cancel-in-progress: true

jobs:
  fast-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
      LFTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
      STAGING_BASE: https://neu.koblenzer-puppenspiele.de
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install FTP client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Deploy editor plugin immediately to staging only
        shell: bash
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?STAGING_FTP_SERVER secret is missing}"
          : "${FTP_USERNAME:?STAGING_FTP_USERNAME secret is missing}"
          : "${LFTP_PASSWORD:?STAGING_FTP_PASSWORD secret is missing}"
          plugin='wp-content/plugins/koblenzer-puppenspiele-core-phase2-2'
          test -d "$plugin"
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 15;
            open --user '$FTP_USERNAME' --env-password -p 21 '$FTP_SERVER';
            mirror -R --only-newer --no-perms --parallel=4 '$plugin' '/wp-content/plugins/koblenzer-puppenspiele-core-phase2-2';
            bye
          "
          echo 'PASS: latest editor plugin mirrored to staging.'

      - name: Fast staging health check
        shell: bash
        run: |
          set -euo pipefail
          expected=$(sed -n 's/^ \* Version: //p' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/koblenzer-puppenspiele-core.php | head -1)
          test -n "$expected"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache, no-store' \
              "$STAGING_BASE/?kp_staging_bridge_health=1&kp_fast=${GITHUB_SHA}-${attempt}" \
              -o /tmp/fast-health.json \
              && jq -e --arg version "$expected" '.success == true and .data.active == true and .data.version == $version' /tmp/fast-health.json >/dev/null 2>&1; then
              echo "PASS: staging is responding with active plugin $expected"
              exit 0
            fi
            sleep 2
          done
          echo 'ERROR: staging health check did not become ready.' >&2
          [ -s /tmp/fast-health.json ] && cat /tmp/fast-health.json >&2 || true
          exit 1
