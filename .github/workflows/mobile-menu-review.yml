name: Mobile menu visual review

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy staging WordPress"]
    types: [completed]

concurrency:
  group: koblenzer-puppenspiele-mobile-menu-review
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify mobile menu geometry and interaction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-menu-review
          cat > mobile-menu-review-run.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const browser = await chromium.launch({ headless: true });
          const base = 'https://neu.koblenzer-puppenspiele.de/';
          const report = [];
          const failures = [];
          const near = (a,b,tolerance=2) => Math.abs(a-b) <= tolerance;

          for (const viewport of [
            {name:'390x844',width:390,height:844},
            {name:'412x915',width:412,height:915},
            {name:'390x667-short',width:390,height:667},
          ]) {
            const context = await browser.newContext({ viewport: {width:viewport.width,height:viewport.height}, deviceScaleFactor: 1 });
            const page = await context.newPage();
            await page.goto(base, {waitUntil:'domcontentloaded', timeout:45000});
            await page.waitForLoadState('networkidle', {timeout:10000}).catch(()=>{});
            await page.waitForTimeout(800);

            const button = page.locator('.wp-block-navigation__responsive-container-open').first();
            const closed = await button.evaluate(el => {
              const r = el.getBoundingClientRect();
              const s = getComputedStyle(el);
              const nav = el.closest('.kp-site-nav');
              const p = nav ? getComputedStyle(nav) : null;
              const bar = el.closest('.kp-navigation-bar');
              const bs = bar ? getComputedStyle(bar) : null;
              return {
                button:{x:r.x,y:r.y,right:r.right,bottom:r.bottom,width:r.width,height:r.height,position:s.position,display:s.display},
                nav:p?{position:p.position,right:p.right,bottom:p.bottom,top:p.top,left:p.left,width:p.width,height:p.height}:null,
                bar:bs?{position:bs.position,top:bs.top}:null,
                viewport:{width:innerWidth,height:innerHeight}
              };
            });
            await page.screenshot({path:`mobile-menu-review/${viewport.name}-closed.png`,fullPage:false});

            if (closed.button.width < 48 || closed.button.height < 48) failures.push(`${viewport.name}: trigger too small`);
            if (closed.button.right > viewport.width + 1 || closed.button.x < viewport.width * .65) failures.push(`${viewport.name}: trigger not right-aligned`);
            if (closed.bar?.position !== 'sticky') failures.push(`${viewport.name}: navigation bar is not sticky`);

            await button.click();
            await page.waitForTimeout(450);

            const readOpened = () => page.evaluate(() => {
              const trigger = document.querySelector('.kp-site-nav .wp-block-navigation__responsive-container-open');
              const menu = document.querySelector('.kp-site-nav .wp-block-navigation__responsive-container.is-menu-open, .kp-site-nav .wp-block-navigation__responsive-container.has-modal-open');
              const panel = menu?.querySelector('.wp-block-navigation__responsive-close');
              const links = [...(menu?.querySelectorAll('.wp-block-navigation-item__content') || [])];
              const data = el => {
                if (!el) return null;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return {
                  x:r.x,y:r.y,right:r.right,bottom:r.bottom,width:r.width,height:r.height,
                  position:s.position,display:s.display,visibility:s.visibility,
                  overflowY:s.overflowY,scrollHeight:el.scrollHeight,clientHeight:el.clientHeight,
                  backgroundColor:s.backgroundColor,backgroundImage:s.backgroundImage,
                  borderColor:s.borderColor,backdropFilter:s.backdropFilter || s.webkitBackdropFilter || ''
                };
              };
              return {
                bodyMenuOpen: document.body.classList.contains('kp-menu-open'),
                trigger:data(trigger),
                menu:data(menu),
                panel:data(panel),
                itemCount:links.length,
                items:links.map(data),
                viewport:{width:innerWidth,height:innerHeight}
              };
            });

            const opened = await readOpened();
            await page.screenshot({path:`mobile-menu-review/${viewport.name}-open.png`,fullPage:false});

            if (!opened.bodyMenuOpen) failures.push(`${viewport.name}: body open-state class missing`);
            if (!opened.trigger || !near(opened.trigger.x, closed.button.x) || !near(opened.trigger.y, closed.button.y)) failures.push(`${viewport.name}: close X moved away from original trigger position`);
            if (opened.trigger?.position !== 'fixed') failures.push(`${viewport.name}: open-state trigger is not fixed`);
            if (!opened.panel) failures.push(`${viewport.name}: floating glass panel missing`);
            if (opened.panel?.width >= viewport.width * .9) failures.push(`${viewport.name}: panel is effectively full-screen width`);
            if (opened.itemCount < 1) failures.push(`${viewport.name}: navigation has no menu items`);

            if (opened.panel && opened.items.length) {
              const first = opened.items[0];
              const last = opened.items[opened.items.length - 1];
              const topPadding = first.y - opened.panel.y;
              const bottomPadding = opened.panel.bottom - last.bottom;
              const overflowed = opened.panel.scrollHeight > opened.panel.clientHeight + 2;

              if (topPadding > 34) failures.push(`${viewport.name}: excessive empty space above first menu item (${Math.round(topPadding)}px)`);
              if (!overflowed && bottomPadding > 34) failures.push(`${viewport.name}: excessive empty space below last menu item (${Math.round(bottomPadding)}px)`);
              if (first.y < opened.panel.y - 1) failures.push(`${viewport.name}: first menu item is clipped above panel`);
              if (!overflowed && last.bottom > opened.panel.bottom + 1) failures.push(`${viewport.name}: last menu item is clipped below panel`);
              if (overflowed && opened.panel.bottom < viewport.height - 18) failures.push(`${viewport.name}: panel scrolls before using available screen height`);
            }

            if (opened.panel && opened.panel.backgroundImage === 'none') failures.push(`${viewport.name}: glass panel has no layered translucent background`);
            if (opened.panel && !String(opened.panel.backdropFilter).includes('blur')) failures.push(`${viewport.name}: glass panel backdrop blur missing`);

            // Simulate a WordPress editor adding one destination. The card should
            // grow automatically, then return to its original height after removal.
            let dynamicSizing = null;
            if (opened.panel && opened.items.length && opened.panel.scrollHeight <= opened.panel.clientHeight + 2) {
              dynamicSizing = await page.evaluate(async () => {
                const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
                const menu = document.querySelector('.kp-site-nav .wp-block-navigation__responsive-container.is-menu-open, .kp-site-nav .wp-block-navigation__responsive-container.has-modal-open');
                const panel = menu?.querySelector('.wp-block-navigation__responsive-close');
                const list = menu?.querySelector('.wp-block-navigation__container');
                const source = list?.lastElementChild;
                if (!panel || !list || !source) return null;
                const before = panel.getBoundingClientRect().height;
                const clone = source.cloneNode(true);
                clone.setAttribute('data-kp-qa-clone','1');
                const link = clone.querySelector('.wp-block-navigation-item__content');
                if (link) link.textContent = 'Zusätzliche Seite';
                list.appendChild(clone);
                await delay(100);
                const grown = panel.getBoundingClientRect().height;
                clone.remove();
                await delay(100);
                const restored = panel.getBoundingClientRect().height;
                return {before,grown,restored};
              });
              if (!dynamicSizing || dynamicSizing.grown < dynamicSizing.before + 20) failures.push(`${viewport.name}: panel did not grow when a menu item was added`);
              if (dynamicSizing && Math.abs(dynamicSizing.restored - dynamicSizing.before) > 3) failures.push(`${viewport.name}: panel did not shrink after menu item removal`);
            }

            // The exact same orange control must close the navigation again.
            await button.click();
            await page.waitForTimeout(350);
            const stillOpen = await page.locator('.wp-block-navigation__responsive-container.is-menu-open, .wp-block-navigation__responsive-container.has-modal-open').first().isVisible().catch(()=>false);
            if (stillOpen) failures.push(`${viewport.name}: second click on same trigger did not close menu`);
            await page.screenshot({path:`mobile-menu-review/${viewport.name}-closed-again.png`,fullPage:false});

            // After scrolling, the sticky bar must keep the trigger accessible near the top-right.
            await page.evaluate(() => window.scrollTo(0, Math.min(900, document.documentElement.scrollHeight - innerHeight)));
            await page.waitForTimeout(300);
            const sticky = await button.evaluate(el => {
              const r=el.getBoundingClientRect();
              return {x:r.x,y:r.y,right:r.right,bottom:r.bottom,width:r.width,height:r.height};
            });
            if (sticky.y < -1 || sticky.y > 90 || sticky.right > viewport.width + 1) failures.push(`${viewport.name}: sticky trigger is not accessible at top-right after scroll`);
            await page.screenshot({path:`mobile-menu-review/${viewport.name}-sticky.png`,fullPage:false});

            report.push({viewport:viewport.name,closed,opened,dynamicSizing,closedAgain:!stillOpen,sticky});
            await context.close();
          }

          await browser.close();
          await fs.writeFile('mobile-menu-review/report.json', JSON.stringify({report,failures},null,2));
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          EOF
          node mobile-menu-review-run.mjs

      - name: Upload mobile menu review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-menu-review
          path: mobile-menu-review/
          retention-days: 7
