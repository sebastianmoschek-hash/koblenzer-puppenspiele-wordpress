name: Mobile menu visual review

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy staging WordPress"]
    types: [completed]

concurrency:
  group: koblenzer-puppenspiele-mobile-menu-review
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify compact floating mobile menu
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-menu-review
          cat > mobile-menu-review-run.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const browser = await chromium.launch({ headless: true });
          const base = 'https://neu.koblenzer-puppenspiele.de/';
          const report = [];
          const failures = [];
          const near = (a,b,tolerance=3) => Math.abs(a-b) <= tolerance;

          const readRect = async locator => locator.evaluate(el => {
            const r = el.getBoundingClientRect();
            const s = getComputedStyle(el);
            return {
              x:r.x,y:r.y,right:r.right,bottom:r.bottom,width:r.width,height:r.height,
              position:s.position,overflowY:s.overflowY,scrollHeight:el.scrollHeight,clientHeight:el.clientHeight
            };
          });

          for (const viewport of [
            {name:'390x844',width:390,height:844,maxPanelRatio:.62},
            {name:'412x915',width:412,height:915,maxPanelRatio:.62},
            {name:'390x667-short',width:390,height:667,maxPanelRatio:.72},
          ]) {
            const context = await browser.newContext({ viewport: {width:viewport.width,height:viewport.height}, deviceScaleFactor: 1 });
            const page = await context.newPage();
            await page.goto(base, {waitUntil:'domcontentloaded', timeout:45000});
            await page.waitForLoadState('networkidle', {timeout:10000}).catch(()=>{});
            await page.waitForTimeout(900);

            const button = page.locator('.wp-block-navigation__responsive-container-open').first();
            const initial = await readRect(button);
            const initialBody = await page.locator('body').getAttribute('class') || '';
            await page.screenshot({path:`mobile-menu-review/${viewport.name}-initial.png`,fullPage:false});

            if (initial.width < 48 || initial.height < 48) failures.push(`${viewport.name}: trigger too small`);
            if (initial.right > viewport.width + 1 || initial.x < viewport.width * .65) failures.push(`${viewport.name}: trigger not right-aligned initially`);
            if (initial.position === 'fixed' || initialBody.includes('kp-menu-floating')) failures.push(`${viewport.name}: trigger should start below header in normal flow`);

            await page.evaluate(() => window.scrollTo(0, Math.min(1000, Math.max(500, document.documentElement.scrollHeight - innerHeight))));
            await page.waitForTimeout(450);
            const floated = await readRect(button);
            const floatedBody = await page.locator('body').getAttribute('class') || '';
            await page.screenshot({path:`mobile-menu-review/${viewport.name}-floating.png`,fullPage:false});

            if (!floatedBody.includes('kp-menu-floating')) failures.push(`${viewport.name}: floating state missing after scroll`);
            if (floated.position !== 'fixed') failures.push(`${viewport.name}: scrolled trigger is not fixed to viewport`);
            if (floated.y < 90) failures.push(`${viewport.name}: floating trigger pinned too close to top`);
            if (floated.y > viewport.height * .68) failures.push(`${viewport.name}: floating trigger sits too low`);

            await button.click();
            await page.waitForTimeout(450);
            const opened = await page.evaluate(() => {
              const trigger = document.querySelector('.kp-site-nav .wp-block-navigation__responsive-container-open');
              const menu = document.querySelector('.kp-site-nav .wp-block-navigation__responsive-container.is-menu-open, .kp-site-nav .wp-block-navigation__responsive-container.has-modal-open');
              const panel = menu?.querySelector('.wp-block-navigation__responsive-close');
              const links = [...(menu?.querySelectorAll('.wp-block-navigation-item__content') || [])];
              const data = el => {
                if (!el) return null;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return {
                  x:r.x,y:r.y,right:r.right,bottom:r.bottom,width:r.width,height:r.height,
                  position:s.position,overflowY:s.overflowY,scrollHeight:el.scrollHeight,clientHeight:el.clientHeight,
                  backdropFilter:s.backdropFilter || s.webkitBackdropFilter || ''
                };
              };
              return {
                bodyMenuOpen: document.body.classList.contains('kp-menu-open'),
                trigger:data(trigger), panel:data(panel), itemCount:links.length, items:links.map(data)
              };
            });
            await page.screenshot({path:`mobile-menu-review/${viewport.name}-open.png`,fullPage:false});

            if (!opened.bodyMenuOpen) failures.push(`${viewport.name}: body open-state class missing`);
            if (!opened.trigger || !near(opened.trigger.x, floated.x) || !near(opened.trigger.y, floated.y)) failures.push(`${viewport.name}: close X moved away from trigger`);
            if (!opened.panel) failures.push(`${viewport.name}: glass panel missing`);
            if (opened.panel?.width >= viewport.width * .85) failures.push(`${viewport.name}: panel is too wide`);
            if (opened.panel?.height > viewport.height * viewport.maxPanelRatio) failures.push(`${viewport.name}: panel is too tall (${Math.round(opened.panel.height)}px)`);
            if (opened.panel && opened.panel.scrollHeight > opened.panel.clientHeight + 2) failures.push(`${viewport.name}: panel requires internal scrolling`);
            if (opened.itemCount < 8) failures.push(`${viewport.name}: expected navigation items are missing`);
            if (opened.panel && opened.items.length) {
              const first = opened.items[0];
              const last = opened.items[opened.items.length - 1];
              if (first.y < opened.panel.y - 1) failures.push(`${viewport.name}: first menu item clipped`);
              if (last.bottom > opened.panel.bottom + 1) failures.push(`${viewport.name}: last menu item clipped`);
            }
            if (opened.panel && !String(opened.panel.backdropFilter).includes('blur')) failures.push(`${viewport.name}: glass blur missing`);

            await button.click();
            await page.waitForTimeout(350);
            const stillOpen = await page.locator('.wp-block-navigation__responsive-container.is-menu-open, .wp-block-navigation__responsive-container.has-modal-open').first().isVisible().catch(()=>false);
            if (stillOpen) failures.push(`${viewport.name}: same trigger did not close menu`);

            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(450);
            const returned = await readRect(button);
            const returnedBody = await page.locator('body').getAttribute('class') || '';
            await page.screenshot({path:`mobile-menu-review/${viewport.name}-returned.png`,fullPage:false});
            if (returnedBody.includes('kp-menu-floating')) failures.push(`${viewport.name}: floating state did not clear at header`);
            if (returned.position === 'fixed') failures.push(`${viewport.name}: trigger stayed fixed at header`);
            if (!near(returned.y, initial.y, 5)) failures.push(`${viewport.name}: trigger did not return below header`);

            report.push({viewport:viewport.name,initial,floated,opened,closedAgain:!stillOpen,returned});
            await context.close();
          }

          await browser.close();
          await fs.writeFile('mobile-menu-review/report.json', JSON.stringify({report,failures},null,2));
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          EOF
          node mobile-menu-review-run.mjs

      - name: Upload mobile menu review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-menu-review
          path: mobile-menu-review/
          retention-days: 7
