name: CircleCI staging report handoff

on:
  status:
  push:
    branches:
      - main
    paths-ignore:
      - 'qa-results/**'

permissions:
  contents: write
  statuses: read

# CircleCI emits one status event per granular verdict. Keeping every waiter
# alive serialized seven 10+ minute jobs for the same SHA, so the useful final
# handoff could sit behind stale waiters for hours. The newest event has at least
# as much status information as the older one, so cancel the older waiter and let
# only the latest event wait for the complete verdict set.
concurrency:
  group: circleci-staging-report-handoff-${{ github.event.sha || github.sha }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Select deterministic staging verdict or main push
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          STATUS_CONTEXT: ${{ github.event.context }}
          STATUS_STATE: ${{ github.event.state }}
          STATUS_SHA: ${{ github.event.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          eligible=false
          expected_sha=''
          if [[ "$EVENT_NAME" == 'push' ]]; then
            eligible=true
            expected_sha="$PUSH_SHA"
          elif [[ "$EVENT_NAME" == 'status' ]]; then
            case "$STATUS_CONTEXT" in
              'ci/circleci: staging-infra-verdict'|\
              'ci/circleci: staging-editor-verdict'|\
              'ci/circleci: staging-session-undo-verdict'|\
              'ci/circleci: staging-persistence-verdict'|\
              'ci/circleci: staging-text-save-verdict'|\
              'ci/circleci: staging-touch-verdict'|\
              'ci/circleci: staging-visual-verdict')
                case "$STATUS_STATE" in
                  success|failure|error)
                    eligible=true
                    expected_sha="$STATUS_SHA"
                    ;;
                esac
                ;;
            esac
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT_NAME context=$STATUS_CONTEXT state=$STATUS_STATE expected=$expected_sha eligible=$eligible"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.eligible == 'true'
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for all CircleCI staging verdicts
        if: steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected=(
            'ci/circleci: staging-infra-verdict'
            'ci/circleci: staging-editor-verdict'
            'ci/circleci: staging-session-undo-verdict'
            'ci/circleci: staging-persistence-verdict'
            'ci/circleci: staging-text-save-verdict'
            'ci/circleci: staging-touch-verdict'
            'ci/circleci: staging-visual-verdict'
          )

          all_terminal=false
          for attempt in $(seq 1 180); do
            statuses="$(gh api "repos/$REPO/commits/$EXPECTED_SHA/statuses?per_page=100")"
            all_terminal=true
            for context in "${expected[@]}"; do
              state="$(jq -r --arg context "$context" '[.[] | select(.context == $context)][0].state // "missing"' <<<"$statuses")"
              echo "$context = $state"
              case "$state" in
                success|failure|error) ;;
                *) all_terminal=false ;;
              esac
            done
            if [[ "$all_terminal" == true ]]; then
              break
            fi
            sleep 5
          done

          if [[ "$all_terminal" != true ]]; then
            echo "Not all staging verdicts reached a terminal state for $EXPECTED_SHA."
            exit 1
          fi

      - name: Fetch exact staging-lab handoff
        if: steps.gate.outputs.eligible == 'true'
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
        run: |
          set -euo pipefail
          base='https://neu.koblenzer-puppenspiele.de/wp-content/uploads/kp-homepage-lab/latest'
          mkdir -p /tmp/kp-circleci-handoff qa-results

          found=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --location --max-time 20 \
                "$base/report.json?handoff=${EXPECTED_SHA}-${attempt}" -o /tmp/kp-circleci-handoff/report.json; then
              actual="$(jq -r '.commit // empty' /tmp/kp-circleci-handoff/report.json 2>/dev/null || true)"
              if [[ "$actual" == "$EXPECTED_SHA" ]]; then
                found=true
                break
              fi
              echo "Waiting for exact staging report: expected=$EXPECTED_SHA current=${actual:-empty} attempt=$attempt"
            fi
            sleep 5
          done
          if [[ "$found" != true ]]; then
            echo "No exact CircleCI staging report for $EXPECTED_SHA after all verdicts completed."
            exit 1
          fi

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            "$base/report.md?handoff=${EXPECTED_SHA}" -o /tmp/kp-circleci-handoff/report.md
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            "$base/diagnostics.txt?handoff=${EXPECTED_SHA}" -o /tmp/kp-circleci-handoff/diagnostics.txt
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            "$base/editor/report.json?handoff=${EXPECTED_SHA}" -o /tmp/kp-circleci-handoff/editor-report.json \
            || printf '{"success":false,"failures":["editor report unavailable"]}\n' > /tmp/kp-circleci-handoff/editor-report.json

          cp /tmp/kp-circleci-handoff/report.json qa-results/circleci-latest.json
          cp /tmp/kp-circleci-handoff/report.md qa-results/circleci-latest.md
          cp /tmp/kp-circleci-handoff/diagnostics.txt qa-results/circleci-latest-diagnostics.txt
          cp /tmp/kp-circleci-handoff/editor-report.json qa-results/circleci-latest-editor.json

      - name: Publish report without triggering another CI round
        if: steps.gate.outputs.eligible == 'true'
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
        run: |
          set -euo pipefail
          git config user.name 'kp-staging-report-handoff'
          git config user.email 'staging-report@users.noreply.github.com'
          git add qa-results/circleci-latest.json qa-results/circleci-latest.md qa-results/circleci-latest-diagnostics.txt qa-results/circleci-latest-editor.json
          if git diff --cached --quiet; then
            echo 'Staging handoff is already current.'
            exit 0
          fi
          git commit -m "qa: hand off CircleCI staging report ${EXPECTED_SHA:0:8} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
