name: KP Studio Cloud APK
on:
  push:
    branches: [codex/kp-editor-ai-staging]
    paths: [android/kp-studio-cloud/**, .github/workflows/kp-studio-cloud-android.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: android/kp-studio-cloud
      - uses: actions/upload-artifact@v4
        with:
          name: kp-studio-cloud-apk
          path: android/kp-studio-cloud/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
