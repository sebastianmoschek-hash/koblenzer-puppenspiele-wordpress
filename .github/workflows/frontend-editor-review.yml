name: Frontend editor review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-frontend-editor-v2.php'
      - 'wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-edit-focus.php'
      - 'wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-frontend-card-controls.php'
      - 'wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-editor-v2.js'
      - 'wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-editor-v2.css'
      - 'wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-card-controls.js'
      - 'wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-card-controls.css'
      - 'wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/koblenzer-puppenspiele-core.php'
      - '.github/workflows/frontend-editor-review.yml'

concurrency:
  group: koblenzer-puppenspiele-frontend-editor-review
  cancel-in-progress: true

jobs:
  syntax-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: PHP syntax
        run: |
          php -l wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-frontend-editor-v2.php
          php -l wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-edit-focus.php
          php -l wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-frontend-card-controls.php
          php -l wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/koblenzer-puppenspiele-core.php

      - name: JavaScript syntax
        run: |
          node --check wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-editor-v2.js
          node --check wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-card-controls.js

      - name: Durable save contract
        run: |
          grep -Fq "page_key:cfg.pageKey" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-editor-v2.js
          grep -Fq "remove_action( 'wp_ajax_kp_fe_v2_save'" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-edit-focus.php
          grep -Fq "add_action( 'wp_ajax_kp_fe_v2_save'" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-edit-focus.php
          grep -Fq '$all[ $page_key ] = $page;' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-edit-focus.php
          grep -Fq '$stored_page !== $page' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-edit-focus.php
          grep -Fq 'Dauerhaft gespeichert ✓' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-edit-focus.php

      - name: Mobile owner controls contract
        run: |
          grep -Fq 'commitActiveInlineText' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-edit-focus.php
          grep -Fq "label.textContent='Vorschau'" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-edit-focus.php
          grep -Fq 'grid-template-columns:1fr 1fr 1fr' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-edit-focus.php
          grep -Fq '✏️&nbsp; Bearbeiten' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-edit-focus.php
          grep -Fq "'kp-frontend-edit-v2'" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-edit-focus.php

      - name: Content links stay editable
        run: |
          grep -Fq "return !!anchor.closest('nav,.wp-block-navigation,.wp-block-navigation__responsive-container,.kp-navigation-bar,.kp-site-nav');" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-edit-focus.php
          grep -Fq 'Text, Bild oder Button antippen = bearbeiten' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-edit-focus.php
          if grep -Fq "anchor.closest('.kp-repertoire-card')" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-edit-focus.php; then echo 'Repertoire links are still forced to navigate'; exit 1; fi
          if grep -Fq "^\\/repertoire\\/" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-edit-focus.php; then echo 'Content repertoire paths are still forced to navigate'; exit 1; fi

      - name: Mobile direct-edit contract
        run: |
          grep -Fq "contentEditable='true'" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-editor-v2.js
          grep -Fq "assignFallbackKeys" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-editor-v2.js
          if grep -Fq "closest('[data-kp-edit-key]')" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-editor-v2.js; then echo 'Ancestor block exclusion returned'; exit 1; fi
          grep -Fq 'max-height:34dvh' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-editor-v2.css
          grep -Fq 'Mehr Angaben' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-editor-v2.js

      - name: Repertoire card direct-control contract
        run: |
          grep -Fq "array( 'kp-frontend-editor-v2' )" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-frontend-card-controls.php
          grep -Fq 'window.KPFrontendEditorV2' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-card-controls.js
          grep -Fq "post('kp_fe_v2_record'" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-card-controls.js
          grep -Fq "post('kp_frontend_card_image_save'" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-card-controls.js
          grep -Fq "post('kp_frontend_card_button_save'" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-card-controls.js
          grep -Fq 'temporarilyShieldLink' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-card-controls.js
          grep -Fq '.kp-repertoire-image' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-card-controls.js
          grep -Fq '.kp-repertoire-card-actions .kp-termine-button' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-card-controls.js
          grep -Fq '.kp-fe2-editing' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-card-controls.css

      - name: Appointment status safety
        run: |
          grep -Fq "'planned' => 'In Planung'" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-frontend-editor-v2.php
          grep -Fq "'box_office' => 'Eintritt Tageskasse'" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-frontend-editor-v2.php

      - name: Only v2 is activated
        run: |
          grep -Fq 'KP_Frontend_Editor_V2::init();' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/koblenzer-puppenspiele-core.php
          grep -Fq 'KP_Owner_Edit_Focus::init();' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/koblenzer-puppenspiele-core.php
          grep -Fq 'KP_Frontend_Card_Controls::init();' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/koblenzer-puppenspiele-core.php
          if grep -Fq 'KP_Frontend_Editor::init();' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/koblenzer-puppenspiele-core.php; then echo 'Old editor still active'; exit 1; fi
