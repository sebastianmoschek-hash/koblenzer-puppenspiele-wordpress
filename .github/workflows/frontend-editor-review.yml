name: Frontend editor review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/**'
      - '.github/workflows/frontend-editor-review.yml'

concurrency:
  group: koblenzer-puppenspiele-frontend-editor-review
  cancel-in-progress: true

jobs:
  syntax-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/plugins/koblenzer-puppenspiele-core-phase2-2 -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-editor-v2.js
          node --check wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-card-controls.js
          node --check wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/owner-web-app.js
          node --check wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/owner-responsive-web.js

      - name: Verified direct-save contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'KP_Frontend_Editor_V2::init();' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/koblenzer-puppenspiele-core.php
          grep -Fq 'KP_Owner_Edit_Reliability::init();' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/koblenzer-puppenspiele-core.php
          grep -Fq 'Dauerhaft gespeichert ✓' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-edit-reliability.php
          grep -Fq 'kp_text_patches' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-edit-reliability.php
          grep -Fq "contentEditable='true'" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/frontend-editor-v2.js
          if grep -Fq 'KP_Frontend_Editor::init();' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/koblenzer-puppenspiele-core.php; then echo 'Old editor still active'; exit 1; fi

      - name: Frontend-only daily workflow contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'KP_Owner_Web_App::init();' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/koblenzer-puppenspiele-core.php
          grep -Fq 'KP_Owner_Responsive_Web::init();' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/koblenzer-puppenspiele-core.php
          grep -Fq 'Werkzeuge' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/owner-web-app.js
          grep -Fq 'Neuer Termin' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/owner-web-app.js
          grep -Fq 'Neues Stück' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/owner-web-app.js
          grep -Fq 'Neue Seite' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/owner-web-app.js
          grep -Fq 'Navigation speichern' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/owner-web-app.js
          grep -Fq 'Design speichern' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/owner-web-app.js
          grep -Fq 'Anzeigegrößen speichern' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/owner-responsive-web.js
          grep -Fq 'body.kp-fe2-editing .kp-fe2-record-footer a' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/owner-web-app.css
          if grep -Fq "admin_url( 'post-new.php?post_type=kp_termin'" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-direct-edit-cta.php; then echo 'Daily quick start still points to backend appointment creation'; exit 1; fi
          if grep -Fq 'Erweiterte Gestaltung' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-direct-edit-cta.php; then echo 'Daily quick start still points to backend design'; exit 1; fi

      - name: Structured content safety contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "'planned' => 'In Planung'" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-frontend-editor-v2.php
          grep -Fq "'box_office' => 'Eintritt Tageskasse'" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-frontend-editor-v2.php
          grep -Fq 'kp_owner_record_create' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-web-app.php
          grep -Fq 'kp_owner_page_create' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-web-app.php
          grep -Fq 'kp_owner_sizes_save' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-responsive-web.php
          grep -Fq 'KP_Responsive_Sizes::OPTION' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-responsive-web.php

      - name: Installable web app contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'kp_webapp_manifest' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-web-app.php
          grep -Fq 'kp_webapp_sw' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-web-app.php
          grep -Fq 'serviceWorker.register' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/owner-web-app.js
          grep -Fq 'display' wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-owner-web-app.php
          test -s wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/kp-app-icon.svg
