name: Publish exact CircleCI staging diagnostics

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  # Keep each source commit's exact-report poll alive independently. A newer
  # product/CI commit must not cancel the poll that is waiting for the staging
  # report belonging to an earlier SHA, otherwise the failure diagnostics are
  # lost precisely when CI is changing quickly.
  group: staging-report-poller-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for exact CircleCI staging handoff
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base='https://neu.koblenzer-puppenspiele.de/wp-content/uploads/kp-homepage-lab/latest'
          mkdir -p /tmp/kp-circleci-handoff qa-results
          found=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error --location --max-time 20 \
                "$base/report.json?poll=${EXPECTED_SHA}-${attempt}" -o /tmp/kp-circleci-handoff/report.json; then
              actual="$(jq -r '.commit // empty' /tmp/kp-circleci-handoff/report.json 2>/dev/null || true)"
              if [[ "$actual" == "$EXPECTED_SHA" ]]; then
                found=true
                break
              fi
              echo "Waiting for exact staging report: expected=$EXPECTED_SHA current=${actual:-empty} attempt=$attempt"
            else
              echo "Staging report not reachable yet (attempt $attempt)."
            fi
            sleep 30
          done
          if [[ "$found" != true ]]; then
            echo "No exact CircleCI staging report for $EXPECTED_SHA within polling window."
            exit 1
          fi

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            "$base/report.md?poll=${EXPECTED_SHA}" -o /tmp/kp-circleci-handoff/report.md
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            "$base/diagnostics.txt?poll=${EXPECTED_SHA}" -o /tmp/kp-circleci-handoff/diagnostics.txt
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            "$base/editor/report.json?poll=${EXPECTED_SHA}" -o /tmp/kp-circleci-handoff/editor-report.json \
            || printf '{"success":false,"failures":["editor report unavailable"]}\n' > /tmp/kp-circleci-handoff/editor-report.json

          cp /tmp/kp-circleci-handoff/report.json qa-results/circleci-latest.json
          cp /tmp/kp-circleci-handoff/report.md qa-results/circleci-latest.md
          cp /tmp/kp-circleci-handoff/diagnostics.txt qa-results/circleci-latest-diagnostics.txt
          cp /tmp/kp-circleci-handoff/editor-report.json qa-results/circleci-latest-editor.json

      - name: Publish exact report without another CI round
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'kp-staging-report-poller'
          git config user.email 'staging-report@users.noreply.github.com'
          git add qa-results/circleci-latest.json qa-results/circleci-latest.md qa-results/circleci-latest-diagnostics.txt qa-results/circleci-latest-editor.json
          if git diff --cached --quiet; then
            echo 'Exact staging report is already current.'
            exit 0
          fi
          git commit -m "qa: publish exact CircleCI staging report ${EXPECTED_SHA:0:8} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
