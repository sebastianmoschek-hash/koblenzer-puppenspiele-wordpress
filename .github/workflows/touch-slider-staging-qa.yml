name: Touch slider staging QA

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/touch-gesture-safety.js'
      - 'wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/touch-gesture-safety.css'
      - 'qa/touch-slider-hold-browser-test.mjs'
      - '.github/workflows/touch-slider-staging-qa.yml'
  workflow_run:
    workflows: ['Deploy staging WordPress']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: koblenzer-puppenspiele-touch-slider-staging
  cancel-in-progress: true

jobs:
  held-touch-slider:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Wait for exact touch safety asset on staging
        id: staging_exact
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/touch-slider-asset.log) 2>&1
          local_asset='wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/touch-gesture-safety.js'
          url='https://neu.koblenzer-puppenspiele.de/wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/assets/touch-gesture-safety.js'
          expected=$(sha256sum "$local_asset" | awk '{print $1}')
          echo "Expected SHA256: $expected"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$url?kp_slider_qa=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}" -o /tmp/touch-gesture-safety.js; then
              actual=$(sha256sum /tmp/touch-gesture-safety.js | awk '{print $1}')
              echo "Attempt $attempt staging SHA256: $actual"
              if [ "$actual" = "$expected" ]; then
                echo 'PASS: exact repository touch safety asset is live on staging.'
                exit 0
              fi
            fi
            sleep 4
          done
          echo 'ERROR: staging never served the exact current touch safety asset.' >&2
          exit 1

      - name: Install Chromium
        if: always() && steps.staging_exact.outcome == 'success'
        id: browser_install
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Reproduce swipe vs hold-and-drag against staged asset
        if: always() && steps.browser_install.outcome == 'success'
        id: behavior
        continue-on-error: true
        env:
          KP_TOUCH_SAFETY: /tmp/touch-gesture-safety.js
        shell: bash
        run: |
          set -uo pipefail
          node qa/touch-slider-hold-browser-test.mjs 2>&1 | tee /tmp/touch-slider-behavior.log
          exit ${PIPESTATUS[0]}

      - name: Write auditable slider result
        if: always()
        env:
          ASSET_OUTCOME: ${{ steps.staging_exact.outcome }}
          INSTALL_OUTCOME: ${{ steps.browser_install.outcome }}
          BEHAVIOR_OUTCOME: ${{ steps.behavior.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Touch-Regler – echter Staging-Test'
            echo
            echo "Erzeugt: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Exakte Staging-Datei: $ASSET_OUTCOME"
            echo "Chromium bereit: $INSTALL_OUTCOME"
            echo "Wischen / Halten+Ziehen: $BEHAVIOR_OUTCOME"
            echo
            echo '## Staging-Dateiabgleich'
            echo '```text'
            if [ -s /tmp/touch-slider-asset.log ]; then cat /tmp/touch-slider-asset.log; else echo 'Kein Asset-Log.'; fi
            echo '```'
            echo
            echo '## Browser-Verhalten'
            echo '```text'
            if [ -s /tmp/touch-slider-behavior.log ]; then cat /tmp/touch-slider-behavior.log; else echo 'Kein Browser-Log.'; fi
            echo '```'
          } > /tmp/touch-slider-latest.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p qa-results
          cp /tmp/touch-slider-latest.md qa-results/touch-slider-latest.md
          git add qa-results/touch-slider-latest.md
          if ! git diff --cached --quiet; then
            git commit -m 'qa: update touch slider staging status [skip ci]'
            git push origin HEAD:main
          fi

      - name: Final touch slider gate
        if: always()
        env:
          ASSET_OUTCOME: ${{ steps.staging_exact.outcome }}
          INSTALL_OUTCOME: ${{ steps.browser_install.outcome }}
          BEHAVIOR_OUTCOME: ${{ steps.behavior.outcome }}
        shell: bash
        run: |
          test "$ASSET_OUTCOME" = 'success'
          test "$INSTALL_OUTCOME" = 'success'
          test "$BEHAVIOR_OUTCOME" = 'success'
