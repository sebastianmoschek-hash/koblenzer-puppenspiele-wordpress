name: Final touch Instagram normalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-touch-instagram-normalize.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Normalize known Instagram profile and test fixture click
        shell: python
        run: |
          from pathlib import Path

          social = Path('wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-social-menu-extensions.php')
          s = social.read_text()
          old = """    public static function seed_instagram_profile_once() {
        /* v2 repairs installations where the earlier seed marker was already set
         * before the real profile URL was supplied. We only fill a missing URL;
         * a profile explicitly chosen later by the owner is never overwritten. */
        if ( get_option( 'kp_instagram_profile_seeded_v2', false ) ) { return; }
        $saved = get_option( self::OPTION, array() );
        if ( ! is_array( $saved ) ) { $saved = array(); }
        if ( empty( $saved['instagram_url'] ) ) {
            $saved['instagram_url'] = self::INSTAGRAM_URL;
            update_option( self::OPTION, $saved, false );
        }
        update_option( 'kp_instagram_profile_seeded_v2', '1', false );
    }
"""
          new = """    public static function seed_instagram_profile_once() {
        /* v3 repairs empty values and canonicalizes only this known profile.
         * A genuinely different Instagram profile chosen by the owner is preserved. */
        if ( get_option( 'kp_instagram_profile_seeded_v3', false ) ) { return; }
        $saved = get_option( self::OPTION, array() );
        if ( ! is_array( $saved ) ) { $saved = array(); }
        $current = trim( (string) ( $saved['instagram_url'] ?? '' ) );
        $should_set = '' === $current;
        if ( ! $should_set ) {
            $parts = wp_parse_url( $current );
            $host = strtolower( (string) ( $parts['host'] ?? '' ) );
            $path = untrailingslashit( strtolower( (string) ( $parts['path'] ?? '' ) ) );
            $should_set = in_array( $host, array( 'instagram.com', 'www.instagram.com' ), true )
                && '/koblenzer_puppenspiele' === $path;
        }
        if ( $should_set && self::INSTAGRAM_URL !== $current ) {
            $saved['instagram_url'] = self::INSTAGRAM_URL;
            update_option( self::OPTION, $saved, false );
        }
        update_option( 'kp_instagram_profile_seeded_v3', '1', false );
    }
"""
          if new not in s:
              if old not in s:
                  raise SystemExit('Expected Instagram v2 seed block not found')
              social.write_text(s.replace(old, new, 1))

          test = Path('qa/touch-runtime-browser-test.mjs')
          t = test.read_text()
          old_click = "  await page.locator('.kp-oa-design-save').click();\n"
          new_click = "  await page.locator('.kp-oa-design-save').evaluate(el => el.click());\n"
          if new_click not in t:
              if old_click not in t:
                  raise SystemExit('Expected design-save click not found')
              test.write_text(t.replace(old_click, new_click, 1))
      - name: Verify syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-social-menu-extensions.php
          node --check qa/touch-runtime-browser-test.mjs
          grep -Fq "kp_instagram_profile_seeded_v3" wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-social-menu-extensions.php
          grep -Fq "evaluate(el => el.click())" qa/touch-runtime-browser-test.mjs
      - name: Commit final fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- wp-content/plugins/koblenzer-puppenspiele-core-phase2-2/includes/class-kp-social-menu-extensions.php qa/touch-runtime-browser-test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: canonicalize known Instagram profile and finish touch QA fixture'
          git pull --rebase origin main
          git push origin HEAD:main
