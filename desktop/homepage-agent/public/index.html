<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Sebastian – Homepage-KI</title>
<style>
  :root {
    --bg: #14100c;
    --panel: #1f1913;
    --panel2: #2a221a;
    --accent: #e07b39;
    --accent2: #f0a35e;
    --text: #f2e8dc;
    --muted: #b09a85;
    --ok: #6db26d;
    --err: #d9534f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
    min-height: 100dvh;
  }
  header {
    padding: 12px 16px; display: flex; align-items: center; gap: 10px;
    background: var(--panel); border-bottom: 1px solid #00000030;
  }
  header .logo { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  header h1 { font-size: 17px; font-weight: 700; flex: 1; }
  header .badge { font-size: 11px; background: var(--panel2); padding: 4px 8px; border-radius: 12px; color: var(--muted); }
  #statusBar {
    padding: 6px 16px; font-size: 12px; background: var(--panel2); color: var(--muted);
    display: flex; gap: 8px; align-items: center; min-height: 28px;
  }
  #statusDot { width: 9px; height: 9px; border-radius: 50%; background: #888; flex-shrink: 0; }
  #statusDot.on { background: var(--ok); }
  #statusDot.err { background: var(--err); }
  #chatWrap { flex: 1; overflow-y: auto; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 10px 13px; border-radius: 16px; font-size: 14.5px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; animation: pop .18s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(5px);} to { opacity: 1; transform: none; } }
  .msg.user { align-self: flex-end; background: var(--accent); color: #1a120c; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--panel2); border-bottom-left-radius: 4px; }
  .msg.err { background: #3a1c1a; color: #f2b8b5; }
  .msg .time { display: block; font-size: 10px; color: inherit; opacity: .55; margin-top: 4px; }
  .msg.typing { color: var(--muted); font-style: italic; }
  #micZone { padding: 10px 16px 18px; display: flex; gap: 10px; align-items: center; background: var(--panel); border-top: 1px solid #00000030; }
  #input { flex: 1; background: var(--panel2); color: var(--text); border: 1px solid #00000050; border-radius: 24px; padding: 12px 16px; font-size: 15px; outline: none; }
  #input:focus { border-color: var(--accent); }
  .btn { border: none; border-radius: 50%; width: 52px; height: 52px; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: var(--panel2); color: var(--accent2); transition: transform .12s, box-shadow .12s; }
  .btn:active { transform: scale(.92); }
  .btn.primary { background: var(--accent); color: #1a120c; box-shadow: 0 2px 14px #e07b3960; }
  .btn.rec { background: var(--err); color: white; animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 #d9534f88; } 50% { box-shadow: 0 0 0 12px #d9534f00; } }
  .btn.small { width: 40px; height: 40px; font-size: 17px; }
  #voiceBadge { display: none; font-size: 11px; background: var(--panel2); color: var(--muted); padding: 4px 10px; border-radius: 12px; }
  #voiceBadge.on { display: inline-block; color: var(--ok); }
  @media (min-width: 700px) {
    body { max-width: 760px; margin: 0 auto; border-left: 1px solid #00000040; border-right: 1px solid #00000040; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🤖</div>
  <h1>Sebastian</h1>
  <span id="voiceBadge">🔊 Thorsten</span>
  <span class="badge" id="modelBadge">lokal</span>
</header>

<div id="statusBar"><span id="statusDot"></span><span id="statusText">Verbinde mit Agent…</span></div>

<div id="chatWrap"></div>

<div id="micZone">
  <button class="btn" id="ttsBtn" title="Sprachausgabe an/aus">🔊</button>
  <input id="input" type="text" placeholder="Zum Beispiel: Mach den Button größer …" autocomplete="off" />
  <button class="btn primary" id="sendBtn" title="Senden">➤</button>
  <button class="btn" id="micBtn" title="Spracheingabe">🎤</button>
</div>

<script src="app.js"></script>
</body>
</html>
